  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(0,-2,6,9,0,0,6.2832); ctx.fill();

  ctx.beginPath(); ctx.arc(-3,-8,2,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-8,2,0,6.2832); ctx.fill();
  ctx.restore();
}
function drawEnemies(){
  for (let i=0;i<state.enemies.length;i++){
    const e = state.enemies[i];
    if (e.dead) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.glow, e.x, e.y, e.r*1.9, e.boss?0.95:0.8);
    ctx.restore();
    ctx.save();
    ctx.translate(e.x, e.y);
    const icy = e.slowUntil > state.time;
    if (e.type === 'drifter') drawDrifter(e, icy);
    else if (e.type === 'krill') drawKrill(e, icy);
    else if (e.type === 'darter') drawDarter(e, icy);
    else if (e.type === 'bulwark') drawBulwark(e, icy);
    else if (e.type === 'splitter') drawSplitter(e, icy);
    else if (e.type === 'shade') drawShade(e, icy);
    else if (e.type === 'maelstrom') drawMaelstrom(e);
    else if (e.type === 'anglerking') drawAngler(e);
    ctx.restore();
    if (e.maxHp > 6 && !e.boss){
      const w = e.r*2, hf = clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle = 'rgba(4,18,31,0.7)';
      ctx.fillRect(e.x-w/2, e.y-e.r-9, w, 3);
      ctx.fillStyle = '#FF6A3D';
      ctx.fillRect(e.x-w/2, e.y-e.r-9, w*hf, 3);
    }
  }
}
function drawDrifter(e, icy){
  const r = e.r;
  ctx.fillStyle = icy ? '#A9ECFF' : '#FF6A3D';
  ctx.beginPath(); ctx.arc(0,-r*0.3,r*0.9,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = icy ? '#DFF6FF' : '#FF2E63';
  ctx.lineWidth = 1.6;
  for (let i=-2;i<=2;i++){

function gateInDanger(g){
  if (g.charge >= g.needed || g.kind === 'rot') return false;
  const range = CONFIG.GATE_WARN_RANGE * state.playH;
  for (let i=0;i<state.enemies.length;i++){
    const e = state.enemies[i];
    if (e.dead || e.boss || !e.cloneable || e.lane !== g.lane) continue;
    const d = g.y - e.y;
    if (d >= 0 && d <= range) return true;
  }
  return false;
}
function drawGates(){

function drawGlowMeter(){
  if (state.screen === 'title' || state.screen === 'intro') return;
  const L = state.layout;
  const n = CONFIG.GLOW_MAX;
  const gap = 3;
  const w = L.glowW, h = 7;
  const x = L.glowX, y = L.glowY;
  const segW = (w - (n-1)*gap)/n;
  ctx.save();

  rr(x-2, y-2, w+4, h+4, 5); ctx.fill();
  for (let i=0;i<n;i++){

    const sx = x + i*(segW+gap);
    const locked = i >= glowCap();
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.05)' : 'rgba(79,240,224,0.14)';
    rr(sx, y, segW, h, 3); ctx.fill();

    if (fill > 0){
      ctx.fillStyle = '#4FF0E0';
      rr(sx, y, Math.max(1, segW*fill), h, 3); ctx.fill();
    }
  }
  if (state.glow > 0){
    const edge = x + (state.glow/n)*w;
    const sh = 0.5 + 0.5*Math.sin(state.time*7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

  }
  ctx.restore();

function drawGlyph(kind, x, y, s, col){

        ctx.beginPath();
        ctx.moveTo(-dx*s,-dy*s); ctx.lineTo(dx*s,dy*s);
        ctx.moveTo(dx*s*0.55,dy*s*0.55); ctx.lineTo(dx*s*0.55 - dy*s*0.3, dy*s*0.55 + dx*s*0.3);
        ctx.moveTo(dx*s*0.55,dy*s*0.55); ctx.lineTo(dx*s*0.55 + dy*s*0.3, dy*s*0.55 - dx*s*0.3);
        ctx.stroke();
      }
      break;
    case 'undertow':
      for (let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(-s,-i*s*0.42);
        ctx.quadraticCurveTo(-s*0.35,-i*s*0.42 - s*0.4, 0,-i*s*0.42);
        ctx.quadraticCurveTo(s*0.35,-i*s*0.42 + s*0.4, s,-i*s*0.42);
        ctx.stroke();
      }
      break;
    case 'storm':
      ctx.beginPath();
      ctx.moveTo(s*0.25,-s);
      ctx.lineTo(-s*0.55,s*0.1);
      ctx.lineTo(-s*0.05,s*0.1);
      ctx.lineTo(-s*0.3,s);
      ctx.lineTo(s*0.6,-s*0.2);
      ctx.lineTo(s*0.08,-s*0.2);
      ctx.closePath();
      ctx.fill();
      break;
    case 'ink':
      ctx.beginPath(); ctx.arc(-s*0.22,s*0.06,s*0.55,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.5,-s*0.34,s*0.26,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.5,s*0.55,s*0.18,0,6.2832); ctx.fill();
      break;
    case 'rot':
      ctx.beginPath(); ctx.arc(0,-s*0.12,s*0.62,0,6.2832); ctx.stroke();
      ctx.beginPath(); ctx.arc(-s*0.24,-s*0.2,s*0.13,0,6.2832); ctx.arc(s*0.24,-s*0.2,s*0.13,0,6.2832); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-s*0.3,s*0.62); ctx.lineTo(-s*0.15,s*0.38); ctx.lineTo(0,s*0.62); ctx.lineTo(s*0.15,s*0.38); ctx.lineTo(s*0.3,s*0.62); ctx.stroke();
      break;
    case 'mend':
      ctx.beginPath();
      ctx.moveTo(0,s*0.7);
      ctx.bezierCurveTo(s*1.02,s*0.16, s,-s*0.62, 0,-s*0.7);
      ctx.bezierCurveTo(-s,-s*0.62, -s*1.02,s*0.16, 0,s*0.7);
      ctx.closePath();
      ctx.fill();
      break;
  }
  ctx.restore();
}
function drawRipples(){
  if (!state.ripples.length) return;
  ctx.save();
  for (let i=0;i<state.ripples.length;i++){
    const r = state.ripples[i];
    const p = 1 - r.t/r.max;
    const rad = 10 + r.r*p;
    const a = clamp(r.t/r.max,0,1);
    ctx.strokeStyle = 'rgba('+r.rgb+','+(a*0.75)+')';
    ctx.lineWidth = 2 + 3*a;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba('+r.rgb+','+(a*0.28)+')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad*0.6, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();
}
function drawNameFlash(){
  const f = state.nameFlash;
  if (!f || state.screen === 'title' || state.screen === 'intro') return;
  const age = f.max - f.t;
  const a = Math.min(1, age/0.12, f.t/0.22);
  ctx.save();
  ctx.globalAlpha = clamp(a,0,1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "900 34px Unbounded, system-ui, sans-serif";
  ctx.fillStyle = f.col || '#FFE9F3';
  ctx.fillText(f.text.toUpperCase(), state.W/2, state.H*0.48);
  ctx.restore();
}
function wrapText(text, maxW, font){
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (let i=0;i<words.length;i++){
    const test = line ? line+' '+words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line){
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}
function drawCallout(){
  const c = state.callout;
  if (!c || state.screen !== 'playing') return;
  const W = state.W, H = state.H;
  const cw = Math.min(CONFIG.CALLOUT_W, W - 28);
  const pad = 20;
  const titleFont = "700 22px Unbounded, system-ui, sans-serif";
  const bodyFont = "400 17px Sora, system-ui, sans-serif";
  const hintFont = "600 11px Sora, system-ui, sans-serif";
  const lineH = 23, titleH = 28, hintH = 16;
  const lines = wrapText(c.text, cw - pad*2, bodyFont);
  const ch = pad + titleH + 8 + lines.length*lineH + 14 + hintH + pad;
  const now = performance.now();
  const a = clamp((now - (c.born || 0))/140, 0, 1);
  let cx = clamp(c.x - cw/2, 12, Math.max(12, W - cw - 12));
  let cy = c.y - ch - 30;
  if (cy < state.topY + 8) cy = c.y + 34;
  cy = clamp(cy, 12, Math.max(12, H - ch - 12));
  const tx = clamp(c.x, 4, W-4), ty = clamp(c.y, 4, H-4);
  const px = clamp(tx, cx, cx+cw);
  const py = ty < cy ? cy : (ty > cy+ch ? cy+ch : ty);

  ctx.save();
  // dim the playfield so the card is the only thing to read
  ctx.fillStyle = 'rgba(2,10,18,0.64)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  // pointer line to the thing being described
  ctx.strokeStyle = 'rgba(79,240,224,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = 'rgba(79,240,224,0.9)';
  ctx.beginPath(); ctx.arc(tx, ty, 2.8, 0, 6.2832); ctx.fill();
  // card
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = 'rgba(6,24,40,0.97)';
  rr(cx, cy, cw, ch, 16); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(79,240,224,0.5)';
  ctx.lineWidth = 1.2;
  rr(cx+0.5, cy+0.5, cw-1, ch-1, 16); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#FFD76A';
  ctx.font = titleFont;
  ctx.fillText(c.title, cx+pad, cy+pad);
  ctx.fillStyle = '#CBE6F5';
  ctx.font = bodyFont;
  for (let i=0;i<lines.length;i++){
    ctx.fillText(lines[i], cx+pad, cy+pad+titleH+8+i*lineH);
  }
  // hint
  ctx.globalAlpha = a * (0.62 + 0.22*Math.sin(now/450));
  ctx.fillStyle = '#6FA6C4';
  ctx.font = hintFont;
  ctx.textAlign = 'center';
  ctx.fillText('Tap to continue', cx+cw/2, cy+ch-pad-hintH+3);
  ctx.restore();
}
function drawBanner(){
  if (!state.banner) return;
  const b = state.banner;
  const t = 1 - b.t/b.max;
  const a = b.t > b.max-0.3 ? (b.max-b.t)/0.3 : (b.t < 0.4 ? b.t/0.4 : 1);
  ctx.save();
  ctx.globalAlpha = clamp(a,0,1);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = "900 40px Unbounded, system-ui, sans-serif";
  ctx.fillStyle = '#EAFBFF';
  ctx.shadowColor = 'rgba(79,240,224,0.6)';
  ctx.fillText(b.text, state.W/2, state.H*0.42);
  ctx.restore();
}

function diveStep(){

function selectDive(i){

  diveIdx = i;

  for (let k=0;k<cards.length;k++){ cards[k].classList.toggle('on', k === i); dots[k].classList.toggle('on', k === i); }

  play.classList.toggle('day', key === 'daily');

  } else {
    play.disabled = true; play.textContent = 'Locked';
  }
}

    if (i === introIndex) d.className = 'on';
    dots.appendChild(d);
  }
  $('btnIntroNext').textContent = introIndex === INTRO_CARDS.length-1 ? 'Dive' : 'Next';
}
function showIntro(fromPlay, daily){
  if (BOT) return;
  introFromPlay = !!fromPlay;
  introDaily = daily == null ? state.daily : daily;
  introIndex = 0;
  introSwipe = null;
  renderIntro();
  state.screen = 'intro';
  showScreen('intro');
}
function introNext(){
  if (introIndex < INTRO_CARDS.length-1){ introIndex++; renderIntro(); return; }
  finishIntro();
}
function introPrev(){
  if (introIndex > 0){ introIndex--; renderIntro(); }
}
function finishIntro(){
  introSwipe = null;
  markSeen('intro');
  if (introFromPlay) startRun(introDaily);
  else { state.screen = 'title'; showScreen('title'); updateTitleExtras(); }
}
function updateMuteUI(){
  const icon = '<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>' +
    (save.muted ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>' : '<path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/>') + '</svg>';
  const label = save.muted ? 'Sound off, tap to turn on' : 'Sound on, tap to mute';
  ['btnMuteTitle','btnMute'].forEach(function(id){
    $(id).innerHTML = icon;
    $(id).setAttribute('aria-label', label);
    $(id).title = label;
  });
}

/* ============================ INPUT ============================ */
let gesture = null;
function pearlSlotAt(x, y){
  const L = state.layout;
  const rr2 = (L.trayR + 4)*(L.trayR + 4);
  for (let i=0;i<traySlots();i++){
    const dx = x - L.trayCx[i], dy = y - L.trayCy;
    if (dx*dx + dy*dy <= rr2) return i;
  }
  return -1;
}
function moveLane(dir){
  state.player.lane = clamp(state.player.lane + dir, 0, CONFIG.LANES-1);
}
canvas.addEventListener('pointerdown', function(ev){
  Audio_.ensure(); Audio_.resume();
  if (state.screen !== 'playing') return;
  if (state.callout){ dismissCallout(); gesture = null; return; }
  const slot = pearlSlotAt(ev.clientX, ev.clientY);
  if (slot >= 0){
    if (state.pearls[slot]) usePearl(slot);
    gesture = null;
    return;
  }
  gesture = { anchorX: ev.clientX, startX: ev.clientX, t0: performance.now(), changed: false };
  try { canvas.setPointerCapture(ev.pointerId); } catch(e){}
});
canvas.addEventListener('pointermove', function(ev){
  if (!gesture || state.screen !== 'playing' || state.callout) return;
  const threshold = Math.max(28, 0.12*laneW());
  const dx = ev.clientX - gesture.anchorX;
  if (Math.abs(dx) >= threshold){
    moveLane(dx > 0 ? 1 : -1);
    gesture.anchorX = ev.clientX;
    gesture.changed = true;
  }
});
window.addEventListener('pointerup', function(ev){
  if (!gesture) return;
  const g = gesture;
  gesture = null;
  if (state.screen !== 'playing' || state.callout) return;
  if (!g.changed && performance.now() - g.t0 <= 250 && Math.abs(ev.clientX - g.startX) > 18){
    moveLane(ev.clientX > g.startX ? 1 : -1);
  }
});
window.addEventListener('pointercancel', function(){ gesture = null; });
window.addEventListener('keydown', function(ev){
  if (state.screen !== 'playing') return;
  if (state.callout){
    if (ev.key === ' ' || ev.key === 'Spacebar' || ev.key === 'Enter'){
      ev.preventDefault();
      dismissCallout();
    }
    return;
  }
  if (ev.key === 'ArrowLeft'){ state.player.lane = clamp(state.player.lane-1,0,CONFIG.LANES-1); }
  else if (ev.key === 'ArrowRight'){ state.player.lane = clamp(state.player.lane+1,0,CONFIG.LANES-1); }
});
window.addEventListener('keydown', function(ev){
  if (state.screen !== 'intro') return;
  if (ev.key === 'ArrowRight'){ ev.preventDefault(); introNext(); }
  else if (ev.key === 'ArrowLeft'){ ev.preventDefault(); introPrev(); }
  else if (ev.key === 'Escape'){ ev.preventDefault(); finishIntro(); }
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden && state.screen === 'playing'){ state.screen='paused'; showScreen('paused'); }
});
$('btnPlay').addEventListener('click', function(){
  if (BOT || save.seen.indexOf('intro') >= 0){ startRun(state.daily); return; }
  showIntro(true, state.daily);
});
$('btnHowto').addEventListener('click', function(){ showIntro(false, state.daily); });
$('btnIntroNext').addEventListener('click', function(ev){ ev.stopPropagation(); introNext(); });
$('btnIntroSkip').addEventListener('click', function(ev){ ev.stopPropagation(); finishIntro(); });
introEl.addEventListener('pointerdown', function(ev){
  if (state.screen !== 'intro') return;
  if (ev.target && ev.target.closest && ev.target.closest('button')) return;
  introSwipe = { x:ev.clientX, t:performance.now() };
});
introEl.addEventListener('pointerup', function(ev){
  if (state.screen !== 'intro' || !introSwipe) return;
  const g = introSwipe;
  introSwipe = null;
  const dx = ev.clientX - g.x;
  if (Math.abs(dx) < 40 || performance.now() - g.t > 900) return;
  if (dx < 0) introNext(); else introPrev();
});
window.addEventListener('pointercancel', function(){ introSwipe = null; });
$('btnGuide').addEventListener('click', function(){
  state.screen = 'guide';
  buildGuide();
  showScreen('guide');
});
$('btnGuideClose').addEventListener('click', function(){
  state.screen = 'title';
  showScreen('title');
  updateTitleExtras();
});
$('btnResetTips').addEventListener('click', function(){
  // Also clears the `intro` flag, so the intro plays again before the next run.
  save.seen = [];
  persist();
  buildGuide();
});
$('btnMuteTitle').addEventListener('click', function(){
  save.muted = !save.muted; persist(); Audio_.setMuted(save.muted); updateMuteUI();
});
$('btnMute').addEventListener('click', function(){
  save.muted = !save.muted; persist(); Audio_.setMuted(save.muted); updateMuteUI();
});
$('btnPause').addEventListener('click', function(){
  if (state.screen === 'playing'){ state.screen='paused'; showScreen('paused'); }
});
$('btnResume').addEventListener('click', function(ev){ ev.stopPropagation(); if (state.screen==='paused'){ state.screen='playing'; showScreen('playing'); } });
$('btnQuit').addEventListener('click', function(ev){ ev.stopPropagation(); state.screen='title'; showScreen('title'); updateTitleExtras(); });
pauseEl.addEventListener('click', function(){ if (state.screen==='paused'){ state.screen='playing'; showScreen('playing'); } });
$('btnRetry').addEventListener('click', function(){ startRun(state.daily); });
let shareText = '';
$('btnShare').addEventListener('click', function(){
  try {
    navigator.clipboard.writeText(shareText).then(function(){ $('btnShare').textContent = 'Copied'; }, function(){ $('btnShare').textContent = shareText; });
  } catch(e){ $('btnShare').textContent = shareText; }
});
$('btnMenu').addEventListener('click', function(){ state.screen='title'; showScreen('title'); updateTitleExtras(); });
let swallowClick = false;
window.addEventListener('pointerdown', function(ev){
  Audio_.ensure(); Audio_.resume();
  if (state.screen === 'playing' && state.callout){
    // The dismissing tap must not also move the player, use a pearl or hit a button.
    dismissCallout();
    gesture = null;
    swallowClick = true;
    setTimeout(function(){ swallowClick = false; }, 500);
    ev.preventDefault();
    ev.stopPropagation();
  } else {
    swallowClick = false;
  }
}, true);
window.addEventListener('click', function(ev){
  if (!swallowClick) return;
  swallowClick = false;
  ev.preventDefault();
  ev.stopPropagation();
}, true);

/* ============================ BOT AUTOSTART ============================ */
let botRetryAt = 0;
function botTick(dt){
  if (!BOT) return;
  if (state.screen === 'title'){ startRun(state.daily); }
  else if (state.screen === 'gameover'){ botRetryAt += dt; if (botRetryAt > 1.5){ botRetryAt = 0; startRun(state.daily); } }
}

/* ============================ LOOP ============================ */
let last = performance.now();
let lastDraw = -1e9;
function frame(now){
  requestAnimationFrame(frame);
  // Cap at 60 fps in play (120 Hz phones would otherwise draw twice as often) and 20 fps elsewhere.
  const active = state.screen === 'playing' && !state.callout;
  const pnow = performance.now();
  if (pnow - lastDraw < (active ? 1000/60 : 1000/20) - 2) return;
  lastDraw = pnow;
  let dt = (now - last)/1000;
  last = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  const frozen = state.screen === 'playing' && !!state.callout;
  if (state.nameFlash && !frozen){ state.nameFlash.t -= dt; if (state.nameFlash.t <= 0) state.nameFlash = null; }
  if (state.screen === 'playing'){
    // A callout hard-pauses the run; no time passes until it is dismissed.
    if (!state.callout) update(dt);
  } else {
    state.time += dt;
    updateAmbience(dt);
    updateParticles(dt);
    updateToasts(dt);
  }
  render();
  botTick(dt);
}

/* ============================ INIT ============================ */
window.GT = {
  CONFIG: CONFIG,
  get state(){ return state; },
  VENT_DEFS: VENT_DEFS,
  ENEMY_TYPES: ENEMY_TYPES,
  PEARLS: PEARLS,
  GLOW_TIERS: GLOW_TIERS,
  fn: { hpMul: hpMul, waveSize: waveSize, waveInterval: waveInterval, availableTypes: availableTypes } // for test/model.js
};
loadSave();
Audio_.muted = save.muted;
resize();

updateTitleExtras();
updateMuteUI();
showScreen('title');
requestAnimationFrame(frame);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
