<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04121F">
<meta name="description" content="Three-lane bioluminescent horde defense for one thumb.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glowtide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Unbounded:wght@700;900&display=swap">
<style>
:root{color-scheme:dark;--cyan:#4FF0E0;--amber:#FFD76A;--coral:#FF6A3D;--danger:#FF2E63;--violet:#7928CA;--ink:#04121F}
html,body{height:100%;margin:0;overflow:hidden;background:#04121F;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
.ui{font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;color:#CBE6F5}
button{font-family:'Sora',system-ui,sans-serif;cursor:pointer;border:0;color:#04121F;background:var(--cyan);border-radius:14px;min-height:48px;font-weight:600;font-size:16px;padding:0 18px;letter-spacing:.02em}
button.ghost{background:transparent;color:#CBE6F5;border:1px solid #2b4f70}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);z-index:10;pointer-events:none}
#hudRow{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.hudStat{display:flex;flex-direction:column;line-height:1}
.hudStat .lbl{font-size:9px;letter-spacing:.18em;color:#5f86a6;font-weight:600}
.hudStat .val{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:19px;color:#EAFBFF;text-shadow:0 0 12px rgba(79,240,224,.5)}
#hudBtns{display:flex;gap:8px;pointer-events:auto}
#hudBtns button{min-height:40px;width:44px;padding:0;font-size:17px;background:rgba(12,42,66,.72);color:#9fe8f2;border:1px solid #24506f}
#zoneBar{margin-top:8px;height:5px;border-radius:4px;background:rgba(27,58,92,.7);overflow:hidden;max-width:340px}
#zoneFill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--amber));transition:width .1s linear}
#bossbar{margin-top:8px;height:12px;border-radius:7px;background:rgba(121,40,202,.28);border:1px solid #5b2a86;overflow:hidden;max-width:420px}
#bossfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7928CA,#FF2E63);transition:width .15s linear}
/* screens */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;background:radial-gradient(120% 80% at 50% 8%,rgba(10,37,64,.72),rgba(4,18,31,.94) 72%)}
#title{font-family:'Sora',system-ui,sans-serif;color:#CBE6F5}
.wordmark{font-family:'Unbounded',system-ui,sans-serif;font-weight:900;font-size:clamp(38px,14vw,58px);letter-spacing:.03em;color:#EAFBFF;margin:0;text-align:center;animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 18px rgba(79,240,224,.35),0 0 44px rgba(79,240,224,.18)}50%{text-shadow:0 0 30px rgba(79,240,224,.75),0 0 70px rgba(184,255,242,.4)}}
@media (prefers-reduced-motion:reduce){.wordmark{animation:none;text-shadow:0 0 24px rgba(79,240,224,.5)}}
.tagline{font-size:14px;color:#6fa6c4;margin:6px 0 16px;letter-spacing:.14em;text-transform:uppercase}
.vname{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:13px;color:#EAFBFF}
.vdesc{font-size:11px;color:#8fb4cc;margin-top:5px;line-height:1.35}
.vcond{font-size:10px;color:var(--amber);margin-top:5px;letter-spacing:.04em}
.rowbtns{display:flex;gap:10px;width:100%;max-width:400px;margin-top:12px}
.rowbtns button{flex:1}
/* title: one swipeable row of dive cards (today's dive, then vents 1-4), one Dive button, icon buttons */
.dives{display:flex;gap:12px;width:calc(100% + 36px);max-width:460px;margin:4px -18px 0;padding:6px min(9%,40px);box-sizing:border-box;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.dives::-webkit-scrollbar{display:none}
.dcard{--tint:79,240,224;position:relative;flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;min-height:224px;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:22px;text-align:left;color:#CBE6F5;background:radial-gradient(120% 90% at 100% 0%,rgba(var(--tint),.16),rgba(var(--tint),0) 60%),rgba(8,30,52,.82);border:1px solid #1d4468;cursor:pointer;overflow:hidden;transition:border-color .2s,opacity .2s,transform .2s}
.dcard:not(.on){opacity:.5;transform:scale(.96)}
.dcard.on{border-color:rgba(var(--tint),.75);box-shadow:0 0 28px rgba(var(--tint),.16)}
.dcard:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.dnum{position:absolute;top:6px;right:14px;font-family:'Unbounded',system-ui,sans-serif;font-weight:900;font-size:64px;line-height:1;color:rgba(var(--tint),.16);pointer-events:none}
.deye{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6fa6c4;font-weight:600}
.dname{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:24px;color:#EAFBFF;line-height:1.1}
.drole{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--tint));font-weight:600}
.dtext{font-size:14px;line-height:1.5;color:#A9C6D8;margin-top:4px;max-width:34ch}
.dmods{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.dmod{font-size:13px;line-height:1.4;color:#A9C6D8}
.dmod b{display:block;font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:12px;color:#FFE9B8}
.dfoot{margin-top:auto;padding-top:8px;font-size:12px;color:#6fa6c4;font-variant-numeric:tabular-nums}
.dcard.locked .dname,.dcard.locked .dtext{opacity:.6}
.dcard.locked .dfoot{color:var(--amber)}
.ddots{display:flex;gap:8px;margin:12px 0 4px}
.ddots button{width:8px;height:8px;min-height:0;padding:0;border-radius:50%;background:#24506f}
.ddots button.on{background:var(--cyan);box-shadow:0 0 10px rgba(79,240,224,.7)}
.ddots button.day{background:#6b5a2a}
.ddots button.day.on{background:var(--amber);box-shadow:0 0 10px rgba(255,215,106,.7)}
.playBtn{width:100%;max-width:340px;min-height:54px;margin-top:10px;font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em}
.playBtn:disabled{background:#1d4468;color:#8fb4cc;cursor:not-allowed}
.playBtn.day{background:var(--amber)}
.iconRow{display:flex;gap:16px;margin-top:16px}
.ibtn{width:52px;height:52px;min-height:0;padding:0;border-radius:50%;background:transparent;border:1px solid #2b4f70;color:#CBE6F5;display:grid;place-items:center}
.ibtn svg,#btnMute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn svg .fill{fill:currentColor;stroke:none}
#btnMute{display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.dcard{transition:none}.dcard:not(.on){transform:none}}
#toast{position:fixed;left:0;right:0;top:0;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.msg{font-family:'Unbounded',system-ui,sans-serif;font-size:14px;color:#FFE9B8;background:rgba(20,42,60,.85);border:1px solid var(--amber);border-radius:12px;padding:9px 16px;box-shadow:0 0 22px rgba(255,215,106,.25)}
.govRow{display:flex;justify-content:space-between;font-size:14px;padding:7px 2px;border-bottom:1px solid rgba(27,58,92,.6);max-width:320px;width:100%}
.govRow b{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;color:#EAFBFF}
#over h2,#pause h2,#boon h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:900;margin:0 0 4px;color:#EAFBFF;font-size:28px}
.sub{font-size:12px;color:#6fa6c4;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.newbest{font-family:'Unbounded',system-ui,sans-serif;font-size:13px;color:var(--amber);margin:10px 0}
.unlock{font-size:13px;color:var(--cyan);margin:4px 0;text-align:center}
.msg.dim{opacity:.62;border-color:#3c617f;color:#A9C6D8;box-shadow:none}
.guideBtn{width:100%;max-width:400px;margin-top:10px}
.guideList{width:100%;max-width:440px;max-height:58vh;overflow-y:auto;text-align:left;padding:2px 4px 2px 0}
/* intro */
#intro{touch-action:none}
.introCard{width:100%;max-width:380px;box-sizing:border-box;background:rgba(10,37,64,.74);border:1px solid #1d4468;border-radius:22px;padding:16px 18px 18px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden}
.introArt{height:150px;display:flex;align-items:center;justify-content:center;margin:0 0 4px}
.introArt svg{width:100%;max-width:300px;height:150px;display:block}
.introTitle{font-family:'Unbounded',system-ui,sans-serif;font-weight:900;font-size:22px;color:#EAFBFF;margin:6px 0 8px}
.introText{font-size:16px;line-height:1.5;color:#A9C6D8;margin:0 auto;max-width:330px;min-height:72px}
.introDots{display:flex;gap:7px;margin:14px 0 4px}
.introDots i{width:7px;height:7px;border-radius:50%;background:#24506f;transition:background .2s,transform .2s}
.introDots i.on{background:var(--cyan);transform:scale(1.25);box-shadow:0 0 10px rgba(79,240,224,.7)}
.introBtns{max-width:340px;margin-top:10px}
.introSkip{margin-top:2px}
.gSec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5f86a6;font-weight:600;margin:14px 0 5px}
.gSec:first-child{margin-top:0}
.gEntry{border-bottom:1px solid rgba(27,58,92,.55);padding:7px 2px}
.gName{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;font-size:12px;color:#EAFBFF}
.gText{font-size:11px;color:#8fb4cc;margin-top:3px;line-height:1.4}
.gEntry.unseen .gName{color:#4d6f8a}
.gEntry.unseen .gText{color:#3f6079}
.linkbtn{background:transparent;border:0;color:#6fa6c4;font-size:12px;text-decoration:underline;min-height:40px;margin-top:8px;padding:0 8px}
.boonList{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;margin-top:6px}
.bcard{display:block;width:100%;text-align:left;background:rgba(10,37,64,.85);color:#CBE6F5;border:1px solid #1d4468;border-radius:16px;padding:14px 16px;min-height:64px}
.bcard:active{transform:scale(.98)}
.bcard .vname{font-size:15px}
.bcard .vdesc{font-size:13px}
.bcard .vdesc b{color:#EAFBFF}
.bcard .chip{float:right;font-family:'Sora',system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6fa6c4;margin-top:2px}
.bcard{--tc:#6fa6c4;transition:border-color .2s,box-shadow .2s}
.bcard.t1{--tc:#6CF0A0;border-color:var(--tc);box-shadow:0 0 14px rgba(108,240,160,.12)}
.bcard.t2{--tc:#5FB4FF;border-color:var(--tc);box-shadow:0 0 18px rgba(95,180,255,.18)}
.bcard.t3{--tc:#C77DFF;border-color:var(--tc);box-shadow:0 0 22px rgba(199,125,255,.24)}
.bcard.t4{--tc:var(--amber);border-color:var(--tc);box-shadow:0 0 28px rgba(255,215,106,.32)}
.bcard.t1,.bcard.t2,.bcard.t3,.bcard.t4{animation-name:tierUp;animation-duration:.25s}
.bcard.t4{animation:tierUp .25s,legend 1.6s ease-in-out .25s infinite alternate}
.bcard .chip{color:var(--tc)}
@keyframes tierUp{50%{transform:scale(1.03)}}
@keyframes legend{to{box-shadow:0 0 40px rgba(255,215,106,.5)}}
@media (prefers-reduced-motion:reduce){.bcard{animation:none!important;transition:none}}
#hudBoons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:340px}
#hudBoons:empty{display:none}
.hb{--tc:#6fa6c4;font-family:'Sora',system-ui,sans-serif;font-size:8px;font-weight:600;letter-spacing:.1em;line-height:1;color:#CBE6F5;background:rgba(4,18,31,.55);border:1px solid var(--tc);border-radius:7px;padding:3px 5px;opacity:.85}
.hb i{font-style:normal;color:var(--tc);letter-spacing:0;margin-left:3px}
.bcard.rescue{--tc:#FF8FA3;border-color:var(--tc);box-shadow:0 0 18px rgba(255,143,163,.18)}
.hb.t1,.pb.t1{--tc:#6CF0A0}.hb.t2,.pb.t2{--tc:#5FB4FF}.hb.t3,.pb.t3{--tc:#C77DFF}.hb.t4,.pb.t4{--tc:var(--amber)}
.pauseBoons{width:100%;max-width:300px;margin:0 0 14px}
.pauseBoons:empty{display:none}
.pb{--tc:#6fa6c4;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#8fb4cc;border-left:2px solid var(--tc);padding:4px 0 4px 9px;margin:3px 0}
.pb b{color:#EAFBFF;font-weight:600}
.pb span:first-child{white-space:nowrap}
.pb span:last-child{text-align:right}
#safeProbe{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
</style>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudRow">
    <div class="hudStat"><span class="lbl">SCORE</span><span class="val" id="hScore">0</span></div>
    <div class="hudStat"><span class="lbl">DEPTH</span><span class="val" id="hDepth">0m</span></div>
    <div id="hudBtns">
      <button id="btnPause" aria-label="Pause">II</button>
      <button id="btnMute" aria-label="Mute">&#9835;</button>
    </div>
  </div>
  <div id="zoneBar"><i id="zoneFill"></i></div>
  <div id="hudBoons"></div>
  <div id="bossbar" class="hidden"><i id="bossfill"></i></div>
</div>

<div id="title" class="screen ui">
  <h1 class="wordmark">GLOWTIDE</h1>
  <div class="tagline">Hold the reef.</div>
  <div class="dives" id="diveList" aria-label="Choose a dive"></div>
  <div class="ddots" id="diveDots"></div>
  <button id="btnPlay" class="playBtn">Dive</button>
  <div class="iconRow">
    <button id="btnHowto" class="ibtn" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.7"/><circle cx="12" cy="17" r=".8" class="fill"/></svg></button>
    <button id="btnGuide" class="ibtn" aria-label="Field guide" title="Field guide"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H18"/></svg></button>
    <button id="btnMuteTitle" class="ibtn" aria-label="Sound" title="Sound"></button>
  </div>
</div>

<div id="intro" class="screen ui hidden">
  <div class="introCard">
    <div class="introArt" id="introArt" aria-hidden="true"></div>
    <h2 class="introTitle" id="introTitle"></h2>
    <p class="introText" id="introText"></p>
  </div>
  <div class="introDots" id="introDots" aria-label="Intro progress"></div>
  <div class="rowbtns introBtns">
    <button id="btnIntroNext">Next</button>
  </div>
  <button id="btnIntroSkip" class="linkbtn introSkip">Skip</button>
</div>

<div id="guide" class="screen ui hidden">
  <h2>FIELD GUIDE</h2>
  <div class="sub">Everything down here</div>
  <div id="guideList" class="guideList"></div>
  <div class="rowbtns" style="max-width:340px">
    <button id="btnGuideClose">Close</button>
  </div>
  <button id="btnResetTips" class="linkbtn">Reset tips</button>
</div>

<div id="pause" class="screen ui hidden">
  <h2>PAUSED</h2>
  <div class="sub">Tap anywhere to resume</div>
  <div id="pauseBoons" class="pauseBoons"></div>
  <div class="rowbtns" style="max-width:260px">
    <button id="btnResume">Resume</button>
    <button id="btnQuit" class="ghost">Menu</button>
  </div>
</div>

<div id="over" class="screen ui hidden">
  <h2>GAME OVER</h2>
  <div class="sub" id="ovSub">The dark closed in</div>
  <div class="govRow"><span>Score</span><b id="ovScore">0</b></div>
  <div class="govRow"><span>Depth</span><b id="ovDepth">0m</b></div>
  <div class="govRow"><span>Kills</span><b id="ovKills">0</b></div>
  <div class="govRow"><span>Gates claimed</span><b id="ovGates">0</b></div>
  <div class="govRow"><span id="ovBestLbl">Best</span><b id="ovBest">0</b></div>
  <div class="newbest hidden" id="ovNewBest">NEW BEST</div>
  <div id="ovUnlocks"></div>
  <div class="rowbtns" style="max-width:340px">
    <button id="btnRetry">Retry</button>
    <button id="btnMenu" class="ghost">Menu</button>
  </div>
  <button id="btnShare" class="linkbtn hidden">Copy result</button>
</div>

<div id="boon" class="screen ui hidden">
  <h2>ZONE CLEARED</h2>
  <div class="sub" id="boonSub">Choose one for this dive</div>
  <div id="boonList" class="boonList"></div>
</div>

<div id="toast"></div>
<div id="safeProbe" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ============================ CONFIG ============================ */
const CONFIG = {

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const Audio_ = {
  ctx:null, master:null, muted:false, lastShot:0,
  ensure:function(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch(e){ this.ctx = null; return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.MASTER_GAIN;
    this.master.connect(this.ctx.destination);
    this.startDrone();
  },
  // The audio thread only runs during play with sound on; menus and mute suspend it to save battery.
  resume:function(){ if (state.screen === 'playing' && !this.muted && this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch(e){} } },
  pause:function(){
    const self = this;
    setTimeout(function(){ if ((state.screen !== 'playing' || self.muted) && self.ctx && self.ctx.state === 'running'){ try { self.ctx.suspend(); } catch(e){} } }, 1500);
  },
  setMuted:function(m){ this.muted = !!m; if (this.master) this.master.gain.value = m ? 0 : CONFIG.MASTER_GAIN; if (m) this.pause(); else this.resume(); },
  startDrone:function(){
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value=55;
    const o2 = this.ctx.createOscillator(); o2.type='sine'; o2.frequency.value=82.5;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
    const g = this.ctx.createGain(); g.gain.value=0.05;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o.start(); o2.start();
  },
  tone:function(freq,dur,type,vol,slideTo,delay){
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (delay||0);
    const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,vol), t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.03);
  },
  noise:function(dur,vol,fFrom,fTo,delay){
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + (delay||0);
    const n = Math.max(1, Math.floor(this.ctx.sampleRate*dur));
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(Math.max(20,fFrom), t0);
    if (fTo) f.frequency.exponentialRampToValueAtTime(Math.max(20,fTo), t0+dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t0); src.stop(t0+dur);
  },
  shot:function(){ const t=performance.now(); if (t-this.lastShot < 55) return; this.lastShot=t; this.tone(900,0.04,'triangle',0.028,600); },
  hit:function(){ this.tone(320,0.05,'square',0.04,220); },
  kill:function(){ this.tone(680,0.12,'sine',0.07,990); },
  charge:function(r){ this.tone(320+r*560,0.05,'sine',0.045); },
  claim:function(){ this.tone(523,0.30,'sine',0.09); this.tone(659,0.30,'sine',0.08,null,0.05); this.tone(784,0.42,'sine',0.09,null,0.10); },
  leak:function(){ this.noise(0.30,0.22,420,70); this.tone(130,0.34,'sine',0.15,55); },
  roar:function(){ this.noise(1.1,0.28,900,110); this.tone(85,1.0,'sawtooth',0.13,48); },
  zoneClear:function(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.28,'sine',0.08,null,i*0.09)); },

};

function loadSave(){
  try {
    const raw = localStorage.getItem('glowtide.v1');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && typeof d === 'object'){
      if (typeof d.best === 'number') save.best = d.best;
      if (d.bestDaily && typeof d.bestDaily === 'object') save.bestDaily = { date:d.bestDaily.date||'', score:d.bestDaily.score||0 };
      if (Array.isArray(d.unlocked)) save.unlocked = d.unlocked.filter(function(k){ return VENT_DEFS[k]; });
      if (typeof d.vent === 'string' && VENT_DEFS[d.vent]) save.vent = d.vent;
      if (typeof d.muted === 'boolean') save.muted = d.muted;
      if (Array.isArray(d.seen)) save.seen = d.seen.filter(function(s){ return typeof s === 'string'; });
      if (d.stats && typeof d.stats === 'object') save.stats = Object.assign(save.stats, d.stats);
      if (d.bestBy && typeof d.bestBy === 'object') save.bestBy = d.bestBy;
      if (d.depthBy && typeof d.depthBy === 'object') save.depthBy = d.depthBy;
      if (!d.bestBy && save.best > 0) save.bestBy = { lantern: save.best }; // before v3.1 there was one shared best
    }
  } catch(e){}
  if (save.unlocked.indexOf('lantern')<0) save.unlocked.push('lantern');
}
function persist(){

/* ============================ SPRITES ============================ */
const spriteCache = {};
function glowSprite(rgb, radius){
  const r = Math.max(4, Math.round(radius));
  const key = rgb + '_' + r;
  let c = spriteCache[key];
  if (c) return c;
  const S = r*4;
  c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0, 'rgba('+rgb+',0.85)');
  grd.addColorStop(0.35, 'rgba('+rgb+',0.32)');
  grd.addColorStop(1, 'rgba('+rgb+',0)');
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  spriteCache[key] = c;
  return c;
}
function drawGlow(rgb, x, y, radius, alpha){
  const s = glowSprite(rgb, radius);
  ctx.globalAlpha = alpha==null?1:alpha;
  ctx.drawImage(s, x - s.width/2, y - s.height/2, s.width, s.height);
  ctx.globalAlpha = 1;
}

/* ============================ AMBIENCE ============================ */
function initAmbience(){
  state.ambience.length = 0;
  for (let i=0;i<46;i++){
    state.ambience.push({
      x: fx()*state.W,
      y: fx()*state.H,
      r: fx()<0.5 ? 0.8+fx()*1.6 : 1.6+fx()*3.2,
      sp: 8 + fx()*26,
      a: 0.15 + fx()*0.4,
      drift: (fx()-0.5)*10,
      phase: fx()*Math.PI*2,
      snow: fx()<0.55
    });
  }
}
function updateAmbience(dt){
  for (let i=0;i<state.ambience.length;i++){
    const a = state.ambience[i];
    a.y -= a.sp*dt;
    a.x += Math.sin(state.time*0.5 + a.phase)*a.drift*dt;
    if (a.y < -10){ a.y = state.H+10; a.x = fx()*state.W; }
  }
}
function drawAmbience(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<state.ambience.length;i++){
    const a = state.ambience[i];
    if (a.snow){
      ctx.globalAlpha = a.a*0.5;
      ctx.fillStyle = '#8FD6EA';
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r*0.6,0,6.2832); ctx.fill();
    } else {
      ctx.globalAlpha = a.a*0.35;
      ctx.strokeStyle = '#57C7E8';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r*2.4,0,6.2832); ctx.stroke();
      ctx.globalAlpha = a.a*0.6;
      ctx.fillStyle = '#BFF3FF';
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================ CANVAS / GEOMETRY ============================ */
function laneX(i){ return state.W*(i+0.5)/CONFIG.LANES; }
function laneW(){ return state.W/CONFIG.LANES; }
let bgGrad = null, bgZone = 0;
function bgColors(zone){
  const t = Math.min(0.85, (zone-1)*0.14);
  const top = mixArr([4,18,31],[3,7,26], t);
  const bot = mixArr([10,37,64],[18,20,74], t);
  return ['rgb('+top.join(',')+')', 'rgb('+bot.join(',')+')'];
}
function buildBg(){
  const c = bgColors(state.zone);
  bgGrad = ctx.createLinearGradient(0,0,0,state.H);
  bgGrad.addColorStop(0,c[0]); bgGrad.addColorStop(1,c[1]);
  bgZone = state.zone;
}
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(CONFIG.DPR_CAP, window.devicePixelRatio||1);
  canvas.width = Math.max(1,Math.floor(w*dpr));
  canvas.height = Math.max(1,Math.floor(h*dpr));
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  state.W = w; state.H = h; state.dpr = dpr;
  state.topY = CONFIG.TOP_Y;
  state.reefY = h - CONFIG.REEF_MARGIN;
  state.playH = Math.max(120, state.reefY - state.topY);
  toastEl.style.top = (state.reefY - CONFIG.TOAST_ABOVE_REEF) + 'px';
  computeLayout();
  buildBg();
  state.player.x = laneX(state.player.lane);
  initAmbience();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* Bottom bar: shells on the left, pearl tray on the right, glow meter above them. */
function computeLayout(){
  const probe = $('safeProbe');
  let safeB = 0;
  if (probe){
    try { safeB = probe.getBoundingClientRect().height || 0; } catch(e){ safeB = 0; }
  }
  if (!isFinite(safeB) || safeB < 0) safeB = 0;
  const L = state.layout;
  L.safeB = safeB;
  const base = state.H - safeB - 10;
  const n = traySlots();
  const gap = CONFIG.TRAY_GAP;
  // A 4th slot (Deep pockets) shrinks the slots so the shells keep their room on narrow phones.
  const R = Math.min(CONFIG.TRAY_SLOT_R, (state.W*0.6 - (n-1)*gap)/(2*n));
  const trayW = n*R*2 + (n-1)*gap;
  const trayLeft = Math.max(60, state.W - 12 - trayW);
  L.trayR = R;
  L.trayCy = base - R;
  for (let i=0;i<n;i++) L.trayCx[i] = trayLeft + R + i*(R*2+gap);
  const shellRight = trayLeft - 18;
  L.shellY = L.trayCy - 2;
  L.shellGap = clamp((shellRight - 28)/Math.max(1, CONFIG.BASE_SHELLS-1), 16, 26);
  L.shellStart = 26;
  L.glowX = 14;
  L.glowY = L.shellY - 30;
  L.glowW = Math.max(70, Math.min(190, shellRight - 14));
}

/* ============================ SAVE / UI HELPERS ============================ */
function toast(text, col, dim){
  // The same message again just stays up longer; at most two messages show at once.
  for (let i=0;i<state.toasts.length;i++){ if (state.toasts[i].el.textContent === text){ state.toasts[i].t = 1.2; return; } }
  const d = document.createElement('div');
  d.className = 'msg' + (dim ? ' dim' : '');
  d.textContent = text;
  if (col) d.style.borderColor = col;
  toastEl.appendChild(d);
  state.toasts.push({ el:d, t:1.2 });
  if (dim) Audio_.tone(340,0.20,'sine',0.04,240);
  else Audio_.claim();
  while (state.toasts.length > 2){ const o = state.toasts.shift(); if (o.el.parentNode) o.el.parentNode.removeChild(o.el); }
}
function updateToasts(dt){
  for (let i=state.toasts.length-1;i>=0;i--){
    const t = state.toasts[i];
    t.t -= dt;
    t.el.style.opacity = String(clamp(t.t/0.4,0,1) * (t.el.className.indexOf('dim')>=0 ? 0.7 : 1));
    if (t.t <= 0){ if (t.el.parentNode) t.el.parentNode.removeChild(t.el); state.toasts.splice(i,1); }
  }
  if (state.banner){ state.banner.t -= dt; if (state.banner.t<=0) state.banner=null; }
}

/* ============================ CALLOUTS ============================ */
function markSeen(id){
  if (BOT) return false;
  if (save.seen.indexOf(id) >= 0) return false;
  save.seen.push(id);
  persist();
  return true;
}
function triggerCallout(id, title, text, x, y){
  if (BOT) return;
  if (!markSeen(id)) return;
  const c = { id:id, title:title, text:text, x:x, y:y, born:performance.now() };
  gesture = null; // an in-flight swipe must not survive the pause
  if (state.callout) state.calloutQueue.push(c);
  else state.callout = c;
}
function triggerGuide(id, x, y){
  const g = GUIDE_BY_ID[id];
  if (g) triggerCallout(id, g.name, g.text, x, y);
}
// Callouts stay up until the player taps (or presses Space/Enter). The game is
// fully paused meanwhile, so dismissing one just advances the queue.
function dismissCallout(){
  state.callout = state.calloutQueue.length ? state.calloutQueue.shift() : null;
  if (state.callout) state.callout.born = performance.now();
  gesture = null;
  last = performance.now();
}

/* ============================ RUN CONTROL ============================ */
function resetRun(daily){
  state.daily = !!daily;
  if (daily){
    state.seed = hashStr(todayStr());
  } else {
    state.seed = (Date.now() ^ (Math.random()*0xffffffff)) >>> 0;
  }
  state.rng = mulberry32(state.seed);
  state.time = 0;
  state.mods = daily ? dailyMods() : [];
  state.vent = VENT_DEFS[save.vent] ? save.vent : 'lantern';
  state.gardenKills = 0; state.flood = false;
  state.player = { lane:1, x:laneX(1), shells: mod('cracked') ? 3 : CONFIG.BASE_SHELLS };
  state.enemies.length = 0; state.bullets.length = 0; state.gates.length = 0;
  state.particles.length = 0; state.sentries.length = 0; state.arcs.length = 0;
  state.spawnQueue.length = 0; state.deathQueue.length = 0;
  state.nextId = 1;
  state.score = 0; state.kills = 0; state.gatesClaimed = 0; state.clones = 0; state.bossesKilled = 0;
  state.zone = 1; state.tZone = 0; state.phase = 'waves';
  state.waveTimer = 2.0; state.gateTimer = CONFIG.GATE_FIRST;
  state.lastWaveLanes.length = 0; state.boss = null; state.advanceTimer = 0; state.boons = {}; state.zoneLeaks = 0; state.dryOffers = 0; state.springPick = []; state.flareUsed = false;
  state.glow = 0; state.glowTier = 0; state.glowGraceUntil = 0; state.glowToastAt = -99;
  state.pearls = mod('armed') ? ['storm','ink','frost'] : [null,null,null];
  state.frostUntil = 0; state.stormUntil = 0; state.stormLv = 1; state.pets = []; state.petCd = 0; state.gateRetry = 0;
  state.pearlLv = [1,1,1];
  computeLayout();
  state.volleyIndex = 0; state.fireCd = 0;
  state.shake = 0; state.laneFlash = [0,0,0]; state.dangerFlash = 0;
  state.toasts.length = 0; state.banner = null; state.nameFlash = null;
  state.callout = null; state.calloutQueue.length = 0; state.ripples.length = 0;
  toastEl.innerHTML = '';
  recalcStats();
  buildBg();
  state.banner = { text:'ZONE 1', t:1.8, max:1.8 };
  if (state.mods.length) toast('Daily · ' + state.mods.map(function(k){ return DAILY_MODS[k].name; }).join(' + '));
  for (let i=0;i<state.pearls.length;i++) if (state.pearls[i]) triggerGuide('pearl:'+state.pearls[i], state.layout.trayCx[i], state.layout.trayCy);
}
function mod(k){ return state.mods.indexOf(k) >= 0; }
function dailyMods(){
  const r = mulberry32(hashStr('mods' + todayStr()));
  const keys = Object.keys(DAILY_MODS), out = [];
  while (out.length < 2) out.push(keys.splice(Math.floor(r()*keys.length),1)[0]);
  return out;
}
// Tidecaller: ebb for 10 s, then flood for 10 s.
function tideSpeed(){ return state.vent !== 'tidecaller' ? 1 : (state.flood ? 1.2 : 0.75); }
function startRun(daily){
  Audio_.ensure(); Audio_.resume();
  resetRun(daily);
  state.screen = 'playing';
  showScreen('playing');
  last = performance.now();
}
function recalcStats(){
  const v = VENT_DEFS[state.vent];
  const s = state.stats;
  const tier = Math.floor(state.glow);
  s.fireRate = v.fireRate * (tier >= 1 ? CONFIG.GLOW_TIER_RATE : 1);
  s.damage = v.dmg;
  s.pierce = v.pierce + (tier >= 3 ? 1 : 0);
  s.bullets = v.bullets;
  s.twin = tier >= 2;
  s.spread = v.spread || 0;
  s.slow = v.slow || 0;
  s.gateChargeMul = (1 + 0.4*boon('gates')) * (mod('heavy') ? 1.5 : 1) * (state.vent === 'tidecaller' && !state.flood ? 2 : 1);
  if (state.vent === 'tidecaller' && state.flood) s.fireRate *= 1.3;
  s.fireRate *= 1 + 0.2*boon('quick');
  s.damage *= 1 + 0.25*boon('keen');
  s.pierce += boon('pierce');
}
function boon(k){ return state.boons[k] || 0; }
function glowCap(){ return Math.min(CONFIG.GLOW_MAX, VENT_DEFS[state.vent].glowMax + boon('bright')); }
function boonTier(k){ const t = BOONS[k].t; return t ? t[Math.min(boon(k), t.length-1)] : -1; }
function springTargets(){ return Object.keys(BOONS).filter(function(k){ return k !== 'spring' && !BOONS[k].once && boon(k) > 0 && boon(k) < BOONS[k].max; }); }
// The rewards Spring tide would level: lowest level first, ties at random.
function rollSpringPick(){
  return springTargets().map(function(k){ return { k:k, n:boon(k), r:state.rng() }; })
    .sort(function(a,b){ return a.n - b.n || a.r - b.r; }).slice(0, SPRING_MAX).map(function(o){ return o.k; });
}
function andList(a){ return a.length > 1 ? a.slice(0,-1).join(', ') + ' and ' + a[a.length-1] : a.join(''); }
function cacheLevel(){ return Math.min(3, 2 + boon('diver')); }
function traySlots(){ return CONFIG.TRAY_SLOTS + boon('pocket'); }
function boonOk(k){
  if (boon(k) >= BOONS[k].max) return false;
  if (k === 'mend') return state.player.shells < CONFIG.BASE_SHELLS-1;
  if (k === 'bright') return glowCap() < CONFIG.GLOW_MAX;
  if (k === 'spring') return springTargets().length >= 2;
  if (k === 'cache') return state.pearls.indexOf(null) >= 0;
  return true;
}
// Roll one card's tier: start at Common, climb while the roll succeeds.
function rollTier(luck){
  let t = 0;
  while (t < REWARD_TIERS.length-1 && state.rng() < REWARD_TIERS[t].climb + luck) t++;
  return t;
}
// Pick a reward of the rolled tier. If none is left there, fall back to the nearest lower tier,
// then the nearest higher one.
function pickOfTier(pool, tier){
  for (let d = 0; d < REWARD_TIERS.length*2; d++){
    const want = d < REWARD_TIERS.length ? tier - d : tier + d - REWARD_TIERS.length + 1;
    const of = pool.filter(function(k){ return boonTier(k) === want; });
    if (of.length) return of[Math.floor(state.rng()*of.length)];
  }
  return null;
}
function offerBoons(){
  const pool = Object.keys(BOONS).filter(function(k){ return boonOk(k) && !BOONS[k].rescue; });
  const flawless = state.zoneLeaks === 0 && state.zone >= 2;
  const lost = CONFIG.BASE_SHELLS - state.player.shells;
  const luck = (flawless ? REWARD_LUCK.flawless : 0) + REWARD_LUCK.perZone*(state.zone-1) + REWARD_LUCK.pity*state.dryOffers + REWARD_LUCK.perShellLost*lost;
  const pick = [];
  let note = state.zone >= 2 ? 'Clear a zone without leaks for rarer rewards' : 'From zone 2 on, a zone without leaks makes rewards rarer';
  if (flawless) note = 'Flawless zone: the tide favours you';
  else if (lost > 0) note = 'Shells lost: the tide sends rarer rewards';
  else if (state.dryOffers) note = 'The tide is turning: rarer rewards are closer';
  const floor = REWARD_LUCK.floor[Math.min(lost, REWARD_LUCK.floor.length-1)];
  while (pick.length < 3 && pool.length){
    const k = pickOfTier(pool, Math.max(rollTier(luck), pick.length ? 0 : floor));
    pool.splice(pool.indexOf(k), 1);
    pick.push(k);
  }
  state.dryOffers = pick.some(function(k){ return boonTier(k) >= 2; }) ? 0 : state.dryOffers + 1;
  state.springPick = pick.indexOf('spring') >= 0 ? rollSpringPick() : [];
  if (state.player.shells <= 2 && boonOk('mend')){ pick.push('mend'); note = 'The reef is cracking: mending is on offer'; }
  // The bot takes the rarest card, or Mend when it is offered.
  if (BOT){ const val = function(k){ return BOONS[k].rescue ? 9 : boonTier(k); };
    takeBoon(pick.reduce(function(a, k){ return val(k) > val(a) ? k : a; })); return; }
  $('boonSub').textContent = note;
  const list = $('boonList');
  list.innerHTML = '';
  pick.forEach(function(k, i){
    const B = BOONS[k], n = boon(k), tier = boonTier(k);
    const lv = B.once || B.max === 1 ? '' : ' · ' + (n ? 'Lv ' + (n+1) + '/' + B.max : 'New');
    const fx1 = B.fx ? B.fx() : '';
    const desc = B.v ? B.lab + ' ' + (n ? B.v(n) + ' → ' : '') + '<b>' + B.v(n + 1) + '</b>' : fx1.charAt(0).toUpperCase() + fx1.slice(1);
    const b = document.createElement('button');
    b.innerHTML = '<div class="vname">' + B.name + '<span class="chip"></span></div><div class="vdesc">' + desc + '</div>';
    const chip = b.querySelector('.chip');
    const show = function(t){ b.className = 'bcard t' + t; chip.textContent = REWARD_TIERS[t].name + lv; };
    // The reveal climbs the tiers one step at a time, like the roll did.
    if (B.rescue){ b.className = 'bcard rescue'; chip.textContent = 'Rescue'; }
    else if (reduceMotion || !tier) show(tier);
    else { show(0); for (let t = 1; t <= tier; t++) setTimeout(show, 160 + i*120 + t*230, t); }
    b.addEventListener('click', function(){ takeBoon(k); });
    list.appendChild(b);
  });
  state.screen = 'boon';
  showScreen('boon');
}
function takeBoon(k){
  if (!BOT && state.screen !== 'boon') return; // a double tap must not skip a zone
  if (k === 'spring') state.springPick.forEach(function(j){ state.boons[j]++; });
  state.boons[k] = boon(k) + 1;
  if (k === 'mend') state.player.shells = CONFIG.BASE_SHELLS;
  if (k === 'pocket'){ state.pearls.push(null); state.pearlLv.push(1); computeLayout(); }
  if (k === 'cache') for (let i=0;i<state.pearls.length;i++) if (!state.pearls[i]){ state.pearls[i] = pickPearlForGate(); state.pearlLv[i] = cacheLevel(); }
  recalcStats();
  state.screen = 'playing';
  showScreen('playing');
  last = performance.now();
  nextZone();
}
// Held rewards: tier-coloured pills under the zone bar ("DMG ●●○"), full effects on the pause screen.
function renderBoons(){
  let hud = '', full = '';
  Object.keys(BOONS).forEach(function(k){
    const B = BOONS[k], n = boon(k);
    if (!n || !B.ab) return;
    const cls = 't' + B.t[Math.min(n, B.t.length) - 1];
    const dots = B.max > 1 ? '●'.repeat(n) + '○'.repeat(B.max - n) : '';
    let fx = B.v ? B.lab + ' ' + B.v(n) : B.fx();
    fx = fx.charAt(0).toUpperCase() + fx.slice(1);
    hud += '<span class="hb ' + cls + '">' + B.ab + (dots ? '<i>' + dots + '</i>' : '') + '</span>';
    full += '<div class="pb ' + cls + '"><span><b>' + B.name + '</b>' + (dots ? ' ' + n + '/' + B.max : '') + '</span><span>' + fx + '</span></div>';
  });
  hudBoonsEl.innerHTML = hud;
  pauseBoonsEl.innerHTML = full;
}
function ventBaseRate(){
  const v = VENT_DEFS[state.vent];
  return v.fireRate;
}
function setGlow(v){
  const oldTier = state.glowTier;
  state.glow = clamp(v, 0, glowCap());
  const tier = Math.floor(state.glow);
  state.glowTier = tier;
  if (tier !== oldTier){
    recalcStats();
    onGlowTier(oldTier, tier);
  }
}
function onGlowTier(oldTier, tier){
  // Glow often hovers at a tier edge (small gains, steady drain): announce changes at most every 4 s.
  const quiet = state.time - state.glowToastAt < 4;
  if (tier > oldTier){
    const t = GLOW_TIERS[tier];
    if (!quiet || tier === glowCap()){ toast('Glow ' + t.roman + ' \u00b7 ' + t.name); state.glowToastAt = state.time; }
    triggerCallout('glow:up', 'Glow', 'Your shots are stronger while Glow lasts. Claim gates to keep it up.', state.player.x, state.reefY - 34);
  } else if (oldTier > 0){
    if (!quiet){ toast('Glow faded \u00b7 ' + GLOW_TIERS[oldTier].name + ' lost', null, true); state.glowToastAt = state.time; }
    triggerCallout('glow:lost', 'Glow faded', 'Claim amber gates to keep your shots strong.', state.layout.glowX + state.layout.glowW*0.5, state.layout.glowY);
  }
}
function gameOver(){
  if (state.screen === 'gameover') return;
  state.screen = 'gameover';
  state.callout = null;
  state.calloutQueue.length = 0;
  Audio_.gameOver();
  const modeKey = state.daily ? 'daily' : state.vent;
  const prevBest = state.daily ? (save.bestDaily.date === todayStr() ? save.bestDaily.score : 0) : (save.bestBy[state.vent] || 0);
  const newBest = state.score > prevBest;
  if (newBest && !state.daily) save.bestBy[state.vent] = state.score;
  if (state.score > save.best) save.best = state.score;
  const medal = state.daily ? (MEDALS.filter(function(m){ return state.zone >= m.zone; })[0] || null) : null;
  if (state.daily){
    if (save.bestDaily.date !== todayStr() || state.score > save.bestDaily.score)
      save.bestDaily = { date:todayStr(), score:state.score, medal: medal ? medal.name : '' };
  }
  const depth = state.zone*100 + Math.floor(Math.min(state.tZone,99));
  save.stats.runs++;
  save.stats.kills += state.kills;
  if (depth > save.stats.bestDepth) save.stats.bestDepth = depth;
  if (!state.daily && depth > (save.depthBy[state.vent] || 0)) save.depthBy[state.vent] = depth;

  const newly = [];
  if (state.zone >= 2 && save.unlocked.indexOf('needle')<0){ save.unlocked.push('needle'); newly.push('needle'); }
  if (state.gatesClaimed >= 6 && save.unlocked.indexOf('spore')<0){ save.unlocked.push('spore'); newly.push('spore'); }
  if (state.bossesKilled >= 2 && save.unlocked.indexOf('tidecaller')<0){ save.unlocked.push('tidecaller'); newly.push('tidecaller'); }
  persist();

  $('ovScore').textContent = String(state.score);
  $('ovDepth').textContent = depth+'m';
  $('ovKills').textContent = String(state.kills);
  $('ovGates').textContent = String(state.gatesClaimed);
  $('ovBest').textContent = String(Math.max(prevBest, state.score));
  $('ovBestLbl').textContent = state.daily ? "Today's best" : 'Best with ' + VENT_DEFS[modeKey].name;
  $('ovNewBest').classList.toggle('hidden', !newBest);
  $('ovSub').textContent = state.daily ? ('Daily '+todayStr() + (medal ? ' · ' + medal.name + ' medal' : '')) : 'The dark closed in';
  shareText = 'Glowtide daily ' + todayStr() + ' · ' + state.mods.map(function(k){ return DAILY_MODS[k].name; }).join(' + ') +
    ' · zone ' + state.zone + ' · ' + state.score + (medal ? ' · ' + medal.name : '');
  $('btnShare').classList.toggle('hidden', !state.daily);
  $('btnShare').textContent = 'Copy result';
  const ul = $('ovUnlocks');
  ul.innerHTML = '';
  for (let i=0;i<newly.length;i++){
    const d = document.createElement('div');
    d.className = 'unlock';
    d.textContent = 'Unlocked: ' + VENT_DEFS[newly[i]].name;
    ul.appendChild(d);
  }
  updateTitleExtras();
  showScreen('gameover');
}
function nextZone(){
  state.zone++;
  state.zoneLeaks = 0;
  state.flareUsed = false;
  state.player.shells = Math.min(CONFIG.BASE_SHELLS, state.player.shells + (mod('cracked') ? 2 : 1));
  state.phase = 'waves';
  state.tZone = 0;
  state.waveTimer = 1.6;
  state.gateTimer = 3;
  state.lastWaveLanes.length = 0;
  state.boss = null;
  state.banner = { text:'ZONE '+state.zone, t:2.0, max:2.0 };
  buildBg();
  Audio_.zoneClear();
}

/* ============================ SPAWNING ============================ */
function newEnemy(type, lane, y, opts){
  opts = opts || {};
  const t = ENEMY_TYPES[type];
  const hm = hpMul();
  const hp = Math.max(1, Math.round(t.hp*hm));
  const e = {
    id: state.nextId++,
    type: type, lane: lane, x: laneX(lane), y: y, prevY: y,
    r: t.r, hp: hp, maxHp: hp, leak: t.leak, score: t.score,
    speed: t.speed, behavior: t.behavior, glow: t.glow,
    dead:false, boss:false, cloneable: opts.clone!==false, processed:false,
    slowMul:1, slowUntil:0, curSlow:1, phase: state.rng()*6.28,
    dashStarted:false, dashT:0, dashX0:0, dashX1:0, xoff:0
  };
  if (type === 'darter' && !opts.instantDash) e.dashAt = state.topY + (0.3 + 0.3*state.rng())*state.playH;
  state.enemies.push(e);
  triggerGuide('enemy:'+type, e.x, e.y);
  return e;
}
function spawnKrillCluster(lane, y){
  const base = laneX(lane);
  for (let i=0;i<CONFIG.KRILL_CLUSTER;i++){
    const e = newEnemy('krill', lane, (y==null? state.topY-8 : y) - i*CONFIG.KRILL_CLUSTER_GAP);
    e.x = base + (state.rng()-0.5)*laneW()*0.7;
  }
}
function spawnClone(src, gate){
  const e = newEnemy(src.type, gate.lane, gate.y + CONFIG.GATE_H*0.5 + 12, { clone:false });
  e.xoff = (state.rng()-0.5)*laneW()*0.5;
  e.x = laneX(gate.lane) + e.xoff;
  e.hp = Math.max(1, Math.round(src.maxHp*CONFIG.CLONE_HP));
  e.maxHp = e.hp;
  state.clones++;
  return e;
}
// The quadratic term outgrows boss rewards, so every run ends eventually.
function hpMul(){ const z = state.zone-1; return (1 + CONFIG.HP_SCALE*z + CONFIG.HP_SCALE_SQ*z*z) * (mod('heavy') ? 1.3 : 1); }
function waveInterval(){ return Math.max(CONFIG.WAVE_INTERVAL_MIN, CONFIG.WAVE_INTERVAL - CONFIG.WAVE_INTERVAL_DEC*(state.zone-1)); }
// Oyster bed: this many more gates, all of the extras pearl gates (Glow gates stay as common).
function oysterExtra(){ return [0,0.10,0.15,0.20][boon('oyster')]; }
function gateInterval(){ return Math.max(CONFIG.GATE_INTERVAL_MIN, CONFIG.GATE_INTERVAL - CONFIG.GATE_INTERVAL_DEC*(state.zone-1)); }
// A lane next to l; edge lanes only step inward (no jumping across the screen).
function neighborLane(l){ return l === 0 ? 1 : (l === CONFIG.LANES-1 ? l-1 : (state.rng() < 0.5 ? l-1 : l+1)); }
function pickLane(){
  const L = CONFIG.LANES;
  let lane = Math.floor(state.rng()*L);
  const lw = state.lastWaveLanes;
  if (lw.length >= 2 && lw[lw.length-1] === lane && lw[lw.length-2] === lane){
    lane = (lane + 1 + Math.floor(state.rng()*(L-1))) % L;
  }
  lw.push(lane); if (lw.length>4) lw.shift();
  return lane;
}
function availableTypes(){
  const t = state.tZone, z = state.zone, out = [];
  out.push({ t:'drifter', w:3 });
  if (t >= 15 || mod('krill')) out.push({ t:'krill', w: mod('krill') ? 6 : 2 });
  if (t >= 30) out.push({ t:'darter', w:2 });
  if (t >= 45 && !mod('krill')) out.push({ t:'bulwark', w:1 });
  if (z >= 2) out.push({ t:'splitter', w:2 });
  if (z >= 2) out.push({ t:'shade', w:1.5 });
  return out;
}
function pickType(){
  const av = availableTypes();
  let total = 0; for (let i=0;i<av.length;i++) total += av[i].w;
  let r = state.rng()*total;
  for (let i=0;i<av.length;i++){ r -= av[i].w; if (r <= 0) return av[i].t; }
  return 'drifter';
}
function waveSize(){ return Math.round((state.zone === 1 ? CONFIG.ZONE1_WAVE_MUL : 1) * CONFIG.WAVE_SIZE_MUL * (CONFIG.WAVE_SIZE_BASE + state.zone + Math.floor(state.tZone/CONFIG.WAVE_SIZE_TZONE_STEP))); }
function scheduleWave(){
  const lane = pickLane();
  const count = waveSize();
  let bulwarks = 0;
  for (let i=0;i<count;i++){
    let type = pickType();
    if (type === 'bulwark'){ if (bulwarks >= 1) type = 'drifter'; else bulwarks++; }
    state.spawnQueue.push({ type:type, lane:lane, t:CONFIG.WAVE_WARN + i*CONFIG.WAVE_SPACING });
  }
  if (state.zone >= 2 && state.rng() < 0.30){
    let l2 = pickLane(); if (l2 === lane) l2 = (l2+1)%CONFIG.LANES;
    const half = Math.max(1, Math.floor(count/2));
    for (let i=0;i<half;i++){
      state.spawnQueue.push({ type: pickType(), lane:l2, t: CONFIG.WAVE_WARN + 0.12 + i*CONFIG.WAVE_SPACING });
    }
  }
}
function pickPearlForGate(){
  let pool = PEARL_KEYS.slice();
  if (state.player.shells >= CONFIG.BASE_SHELLS) pool = pool.filter(function(k){ return k !== 'mend'; });
  const fresh = pool.filter(function(k){ return state.pearls.indexOf(k) < 0; });
  const use = fresh.length ? fresh : pool;
  return use[Math.floor(state.rng()*use.length)];
}
function spawnGate(){
  const occupied = {};
  for (let i=0;i<state.gates.length;i++) occupied[state.gates[i].lane] = true;
  const free = [];
  for (let l=0;l<CONFIG.LANES;l++) if (!occupied[l]) free.push(l);
  if (!free.length) return;
  // Prefer a lane with no creatures near the top, so a new gate is not eaten at once.
  const crowd = function(l){
    let n = 0;
    for (let i=0;i<state.enemies.length;i++){ const e = state.enemies[i]; if (!e.dead && !e.boss && e.lane === l && e.y < state.topY + 0.35*state.playH) n++; }
    for (let i=0;i<state.spawnQueue.length;i++) if (state.spawnQueue[i].lane === l) n++;
    return n;
  };
  let best = Infinity, calm = [];
  for (let i=0;i<free.length;i++){ const c = crowd(free[i]); if (c < best){ best = c; calm = [free[i]]; } else if (c === best) calm.push(free[i]); }
  if (best > 0 && state.gateRetry < 4){ state.gateRetry++; state.gateTimer = 0.8; return; }
  state.gateRetry = 0;
  const lane = calm[Math.floor(state.rng()*calm.length)];
  const noGlow = mod('blacktide') || state.vent === 'needle';
  const kind = (state.zone >= 2 || mod('rot')) && state.rng() < CONFIG.ROT_CHANCE*(mod('rot') ? 3 : 1) ? 'rot'
    : (noGlow || state.rng() < (CONFIG.GATE_PEARL_CHANCE + oysterExtra())/(1 + oysterExtra()) ? 'pearl' : 'glow');
  const x = laneX(lane), y = state.topY + CONFIG.GATE_H*0.5;
  state.gates.push({
    id: state.nextId++, lane: lane, x: x, y: y,
    kind: kind,
    pearl: kind === 'pearl' ? pickPearlForGate() : null,
    pack: kind === 'rot' ? rotPack() : null,
    charge: 0, needed: CONFIG.GATE_CHARGE_BASE + CONFIG.GATE_CHARGE_PER_ZONE*state.zone,
    clones: 0, age: 0, eaten: 0, dead: false
  });
  triggerGuide('gate:'+kind, x, y);
}
// Rotten gates show the creatures caged inside; claiming one sets them free.
function rotPack(){
  const pack = ['splitter'];
  for (let i=0;i<1+Math.floor(state.zone/2);i++) pack.push('drifter');
  return pack;
}
// Ripeness 1-3 grows with a gate's age; each creature passing through eats one level.
function gateStage(g){
  if (g.kind === 'rot') return 1;
  return Math.max(1, 1 + Math.min(2, Math.floor(g.age/(CONFIG.RIPE_TIME*(mod('brood') ? 0.5 : 1)))) - g.eaten);
}

/* ============================ BOSSES ============================ */
function startBoss(){
  state.phase = 'boss';
  Audio_.roar();
  if (state.zone % 2 === 1){
    const hm = hpMul();
    const boss = { kind:'maelstrom', segments:[], spawnT:1.2, dead:false };
    for (let l=0;l<CONFIG.LANES;l++){
      const hp = Math.max(1, Math.round(CONFIG.MAELSTROM_HP*hm));
      const e = {
        id: state.nextId++, type:'maelstrom', lane:l, x:laneX(l), y:state.topY+40, prevY:state.topY+40,
        r: 34, hp:hp, maxHp:hp, leak:0, score:0, speed:CONFIG.MAELSTROM_SPEED, behavior:'boss',
        glow:'121,40,202', dead:false, boss:true, cloneable:false, processed:false, phase:l*2,
        slowMul:1, slowUntil:0, seg:true
      };
      state.enemies.push(e);
      boss.segments.push(e);
    }
    state.boss = boss;
    triggerGuide('boss:maelstrom', laneX(1), state.topY+40);
  } else {
    const hm = hpMul();
    const hp = Math.max(1, Math.round(CONFIG.ANGLER_HP*hm));
    const lane = Math.floor(state.rng()*CONFIG.LANES);
    const e = {
      id: state.nextId++, type:'anglerking', lane:lane, x:laneX(lane), y:state.topY+30, prevY:state.topY+30,
      r: 38, hp:hp, maxHp:hp, leak:0, score:0, speed:CONFIG.ANGLER_SPEED, behavior:'boss',
      glow:'150,50,210', dead:false, boss:true, cloneable:false, processed:false, phase:0,
      slowMul:1, slowUntil:0, kb:0.75, spawnT:1.0, moveT:2.5, telegraph:0, targetLane:lane, lureFlash:0
    };
    state.enemies.push(e);
    state.boss = { kind:'angler', ref:e, dead:false };
    triggerGuide('boss:angler', e.x, e.y);
  }
  bossbarEl.classList.remove('hidden');
}
function bossHpFrac(){
  const b = state.boss;
  if (!b) return 1;
  if (b.kind === 'maelstrom'){
    let hp=0, mx=0;
    for (let i=0;i<b.segments.length;i++){ hp += Math.max(0,b.segments[i].hp); mx += b.segments[i].maxHp; }
    return mx>0 ? hp/mx : 0;
  }
  const e = b.ref; return e.maxHp>0 ? Math.max(0,e.hp)/e.maxHp : 0;
}
function onBossDefeated(){
  const b = state.boss;
  if (!b) return;
  b.dead = true;
  state.bossesKilled++;
  state.score += 1000*state.zone;
  state.boss = null;
  state.advanceTimer = 1.6;
  bossbarEl.classList.add('hidden');
  Audio_.zoneClear();
  state.banner = { text:'CLEARED', t:1.4, max:1.4 };
}
function updateBoss(dt){
  const b = state.boss;
  if (!b) return;
  if (b.kind === 'maelstrom'){
    b.spawnT -= dt;
    if (b.spawnT <= 0){
      b.spawnT = 3;
      for (let i=0;i<b.segments.length;i++){
        const s = b.segments[i];
        if (s.dead) continue;
        for (let k=0;k<2;k++) newEnemy('krill', s.lane, state.topY-8-k*8);
      }
    }
  } else {
    const e = b.ref;
    if (e.dead){ return; }
    e.spawnT -= dt;
    if (e.spawnT <= 0){ e.spawnT = 2.5; const d = newEnemy('darter', e.lane, state.topY-10); d.speed = ENEMY_TYPES.darter.speed; }
    e.moveT -= dt;
    if (e.moveT <= 0 && e.telegraph <= 0){
      e.moveT = 4;
      e.targetLane = neighborLane(e.lane);
      e.telegraph = 0.8;
      e.lureFlash = 0.8;
    }
    if (e.telegraph > 0){
      e.telegraph -= dt;
      if (e.telegraph <= 0){
        e.lane = e.targetLane;
      }
    }
    if (e.lureFlash > 0) e.lureFlash -= dt;
    if (e.hp <= e.kb*e.maxHp && e.maxHp > 0){
      e.y -= 0.08*state.playH;
      e.kb -= 0.25;
      spawnBurst(e.x, e.y, '121,40,202', 10, 90);
      state.shake = Math.max(state.shake, 6);
    }
  }
}

/* ============================ COMBAT ============================ */
function fireVolley(lane, damage, pierce, slow, y){
  const s = state.stats;
  const n = Math.max(1, s.bullets + (s.twin && state.volleyIndex % CONFIG.GLOW_TWIN_EVERY === 0 ? 1 : 0));
  const y0 = y==null ? state.reefY - 16 : y;
  const cx = laneX(lane);
  for (let i=0;i<n;i++){
    const off = n===1 ? 0 : (i-(n-1)/2)*Math.max(s.spread, 9);
    state.bullets.push({
      id: state.nextId++, lane:lane, x: cx+off, y: y0, prevY: y0,
      damage: damage, pierce: pierce, slow: slow||0, hits:{}
    });
  }
}
function fireFrom(lane, damage, pierce, y, noGate){
  const cx = laneX(lane);
  state.bullets.push({ id: state.nextId++, lane:lane, x:cx, y:y, prevY:y, damage:damage, pierce:pierce, slow:0, hits:{}, noGate:!!noGate });
}
function damageEnemy(e, dmg){
  if (!e || e.dead) return;
  e.hp -= dmg;
  if (e.hp <= 0){ e.dead = true; state.deathQueue.push(e); }
}
function hitEnemy(e, bullet){
  damageEnemy(e, bullet.damage);
  if (e.dead) return;
  if (bullet.slow > 0){ e.slowUntil = state.time + 1.5; e.slowMul = 1 - bullet.slow; }
  spawnBurst(e.x, e.y, e.glow, 3, 60);
  Audio_.hit();
}
function spawnBurst(x,y,rgb,n,sp){
  for (let i=0;i<n;i++){
    if (state.particles.length >= CONFIG.MAX_PARTICLES) return;
    const a = fx()*6.2832, s = sp*(0.4+fx());
    state.particles.push({
      x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:0.4+fx()*0.45, max:0.85, rgb:rgb, size:1.5+fx()*2.5
    });
  }
}
function onDeath(e){
  if (e.seg || e.type === 'maelstrom'){
    const b = state.boss;
    spawnBurst(e.x, e.y, '121,40,202', 16, 130);
    if (b && b.kind === 'maelstrom'){
      let alive = 0;
      for (let i=0;i<b.segments.length;i++) if (!b.segments[i].dead) alive++;
      if (alive === 0) onBossDefeated();
    }
    Audio_.kill();
    return;
  }
  if (e.type === 'anglerking'){
    spawnBurst(e.x, e.y, '150,50,210', 40, 200);
    onBossDefeated();
    Audio_.kill();
    return;
  }
  state.kills++;
  state.score += e.score;
  if (state.vent === 'needle' && (e.type === 'bulwark' || e.type === 'splitter' || e.type === 'shade')) setGlow(state.glow + 0.25);
  if (state.vent === 'spore' && ++state.gardenKills % 5 === 0){
    for (let k=state.sentries.length-1;k>=0;k--) if (state.sentries[k].lane === e.lane) state.sentries.splice(k,1);
    state.sentries.push({ lane:e.lane, x:laneX(e.lane), cd:0, rate:4, damage:1, until: state.time + 6, max: 6 });
  }
  spawnBurst(e.x, e.y, e.glow, 7, 110);
  Audio_.kill();
  if (e.type === 'splitter'){
    for (let i=0;i<3;i++){
      const k = newEnemy('krill', e.lane, e.y - 6);
      k.x = e.x + (i-1)*14;
    }
  }
  // Storm: every kill arcs to the frontmost enemy in an adjacent lane. Arc kills
  // enter the same death queue, so chains resolve in processDeaths' guarded loop.
  if (state.stormUntil > state.time && !e.boss){
    const lane = neighborLane(e.lane);
    let target = null;
    for (let i=0;i<state.enemies.length;i++){
      const o = state.enemies[i];
      if (o.dead || o === e || o.lane !== lane) continue;
      if (!target || o.y > target.y) target = o;
    }
    if (target){
      state.arcs.push({ ax:e.x, ay:e.y, bx:target.x, by:target.y, t:0.22, max:0.22 });
      damageEnemy(target, CONFIG.STORM_DMG*hpMul()*(1 + 0.5*(state.stormLv-1)));
      spawnBurst(target.x, target.y, '127,233,255', 5, 80);
    }
  }
}
function processDeaths(){
  let guard = 0;
  while (state.deathQueue.length && guard < 500){
    guard++;
    const e = state.deathQueue.shift();
    if (e.processed) continue;
    e.processed = true;
    const i = state.enemies.indexOf(e);
    if (i >= 0) state.enemies.splice(i,1);
    onDeath(e);
  }
}
function leak(e){
  const lane = e.lane;
  state.player.shells -= Math.max(1, e.leak);
  // Reef burst: the leaking creature explodes and takes the crowd behind it along,
  // so one breach costs a shell instead of the whole horde.
  const burstR = CONFIG.LEAK_BURST_RANGE*state.playH*(1 + boon('burst'));
  const burstY = state.reefY - burstR;
  for (let i=0;i<state.enemies.length;i++){
    const o = state.enemies[i];
    if (o === e || o.lane !== lane || o.boss) continue;
    if (o.y >= burstY) damageEnemy(o, CONFIG.LEAK_BURST_DMG*hpMul());
    o.y -= 0.15*state.playH;
  }
  state.ripples.push({ x:laneX(lane), y:state.reefY, t:0.6, max:0.6, rgb:'255,106,61', r:burstR });
  triggerCallout('leak:burst', 'Reef burst', 'A creature that breaks through costs a shell, but it bursts and takes the creatures right behind it along.', laneX(lane), state.reefY - 30);
  state.laneFlash[lane] = 1;
  state.dangerFlash = 1;
  setGlow(state.glow - CONFIG.LEAK_GLOW - (e.type === 'shade' ? CONFIG.SHADE_DRAIN : 0));
  if (e.type === 'shade') state.ripples.push({ x:e.x, y:state.reefY, t:0.7, max:0.7, rgb:'121,40,202', r:state.playH*0.22 });
  state.zoneLeaks++;
  if (state.pets.length){ state.pets.shift(); toast('A hatchling fled', null, true); }
  if (!reduceMotion) state.shake = Math.max(state.shake, 9);
  spawnBurst(e.x, state.reefY, '255,46,99', 14, 140);
  Audio_.leak();
  const i = state.enemies.indexOf(e);
  if (i >= 0) state.enemies.splice(i,1);
  e.processed = true;
  if (state.player.shells <= 0){ state.player.shells = 0; gameOver(); return; }
  if (state.player.shells <= 2 && !state.flareUsed) reefFlare();
}
// Reef flare: a breather when the reef is nearly lost, so a bad zone can still be turned around.
function reefFlare(){
  state.flareUsed = true;
  for (let i=0;i<state.enemies.length;i++){ const o = state.enemies[i]; if (!o.boss) o.y -= CONFIG.FLARE_PUSH*state.playH; }
  state.ripples.push({ x:state.W/2, y:state.reefY, t:0.9, max:0.9, rgb:'255,201,222', r:state.playH*0.5 });
  spawnBurst(state.W/2, state.reefY - 40, '255,201,222', 30, 180);
  toast('Reef flare · the tide pushes them back', '#FFC9DE');
  triggerCallout('reef:flare', 'Reef flare', 'Once per zone, when you drop to 2 shells, the reef pushes every creature back up the lanes. Use the breather.', state.W/2, state.reefY - 30);
}

/* ============================ PEARLS ============================ */
// A pearl you already hold levels up (max III); otherwise it takes a free slot, or is lost.
function addPearl(key, lvl){
  if (!PEARLS[key]) return false;
  const roman = ['','I','II','III'];
  const held = state.pearls.indexOf(key);
  if (held >= 0 && state.pearlLv[held] < 3){
    state.pearlLv[held] = Math.min(3, state.pearlLv[held] + lvl);
    spawnBurst(state.layout.trayCx[held], state.layout.trayCy, '255,233,243', 18, 100);
    toast(PEARLS[key].name + ' → ' + roman[state.pearlLv[held]], PEARLS[key].col);
    return true;
  }
  const slot = state.pearls.indexOf(null);
  if (slot < 0){
    toast('Tray full · pearl lost', null, true);
    triggerGuide('tray:full', state.layout.trayCx[1], state.layout.trayCy);
    return false;
  }
  state.pearls[slot] = key;
  state.pearlLv[slot] = lvl;
  toast(PEARLS[key].name + (lvl > 1 ? ' ' + roman[lvl] : ''), PEARLS[key].col);
  spawnBurst(state.layout.trayCx[slot], state.layout.trayCy, '255,233,243', 12, 80);
  triggerGuide('pearl:'+key, state.layout.trayCx[slot], state.layout.trayCy);
  return true;
}
function usePearl(i){
  const key = state.pearls[i];
  if (!key) return false;
  const P = PEARLS[key];
  const lane = state.player.lane;
  const L = state.pearlLv[i] || 1, v = P.lv[L-1];
  state.pearls[i] = null;
  state.nameFlash = { text:P.name, t:0.6, max:0.6, col:P.col };
  Audio_.claim();
  Audio_.tone(1050,0.16,'sine',0.06,1500);

  if (key === 'polyp'){
    for (let k=state.sentries.length-1;k>=0;k--){
      if (state.sentries[k].lane === lane) state.sentries.splice(k,1);
    }
    state.sentries.push({ lane:lane, x:laneX(lane), cd:0, rate:ventBaseRate()*CONFIG.POLYP_RATE_MUL*(1 + 0.25*(L-1)), damage:state.stats.damage, until: state.time + v, max: v });
  } else if (key === 'frost'){
    state.frostUntil = Math.max(state.frostUntil, state.time + v);
    state.frostMax = state.frostUntil - state.time;
    for (let k=0;k<state.enemies.length;k++) spawnBurst(state.enemies[k].x, state.enemies[k].y, '169,236,255', 2, 40);
  } else if (key === 'undertow'){
    for (let k=0;k<state.enemies.length;k++){
      const o = state.enemies[k];
      if (!o.boss) o.y -= v*state.playH;
    }
    spawnBurst(state.W/2, state.reefY-40, '255,158,122', 26, 160);
  } else if (key === 'storm'){
    state.stormUntil = Math.max(state.stormUntil, state.time + v);
    state.stormMax = state.stormUntil - state.time;
    state.stormLv = L;
    for (let k=0;k<state.enemies.length;k++){
      if (fx() < 0.4) state.arcs.push({ ax:state.player.x, ay:state.reefY-40, bx:state.enemies[k].x, by:state.enemies[k].y, t:0.18, max:0.18 });
    }
  } else if (key === 'ink'){
    const dmg = v * hpMul();
    for (let k=0;k<state.enemies.length;k++){
      const o = state.enemies[k];
      if (o.lane !== lane || o.dead) continue;
      damageEnemy(o, dmg);
      spawnBurst(o.x, o.y, '154,107,255', 6, 100);
    }
    spawnBurst(laneX(lane), state.reefY - state.playH*0.35, '154,107,255', 30, 190);
    state.ripples.push({ x:laneX(lane), y:state.reefY - state.playH*0.35, t:0.5, max:0.5, rgb:'154,107,255', r: state.playH*0.3 });
  } else if (key === 'mend'){
    state.player.shells = Math.min(CONFIG.BASE_SHELLS, state.player.shells + v);
    spawnBurst(state.player.x, state.reefY-10, '255,201,222', 16, 110);
  }
  return true;
}
function claimGate(g){
  const stage = gateStage(g);
  state.gatesClaimed++;
  state.score += 200*stage;
  spawnBurst(g.x, g.y, gateRgb(g), 24 + 12*(stage-1), 150);
  if (!reduceMotion) state.shake = Math.max(state.shake, 5);
  const bonus = 0.5*(stage-1);
  if (stage === 3 && isDeep(g)){
    state.score += CONFIG.DEEP_SCORE;
    if (state.pets.length >= CONFIG.PET_MAX) state.pets.shift();
    state.pets.push(state.time + CONFIG.PET_LIFE*(1 + 0.5*boon('hatch')));
    state.pets.sort(function(a,b){ return a-b; });
    toast('Hatchling! · +' + CONFIG.DEEP_SCORE, '#8FF7D2');
    spawnBurst(state.player.x, state.reefY - 10, '143,247,210', 24, 140);
  }
  if (g.kind === 'pearl'){
    addPearl(g.pearl, Math.min(3, stage + boon('diver'))); // the gate label shows this level
  } else if (g.kind === 'rot'){
    addGlow(CONFIG.ROT_GLOW);
    for (let k=0;k<g.pack.length;k++){
      const e = newEnemy(g.pack[k], g.lane, g.y - 8 - k*24, { clone:false });
      e.xoff = (k%2 ? 1 : -1)*laneW()*0.12;
    }
    toast('+' + CONFIG.ROT_GLOW + ' Glow · they broke free', '#B4E35A');
  } else {
    addGlow(1 + bonus);
  }
}
function isDeep(g){ return g.y >= state.reefY - CONFIG.DEEP_RANGE*state.playH; }
// A pearl gate is worthless while the tray is full and you hold no pearl of its kind below III.
function pearlWasted(g){
  if (g.kind !== 'pearl' || state.pearls.indexOf(null) >= 0) return false;
  const h = state.pearls.indexOf(g.pearl);
  return h < 0 || state.pearlLv[h] >= 3;
}
function gateRgb(g){ return g.kind === 'pearl' ? '255,233,243' : (g.kind === 'rot' ? '180,227,90' : '255,215,106'); }
function addGlow(n){
  state.glowGraceUntil = state.time + CONFIG.GLOW_GRACE;
  const over = state.glow + n - glowCap();
  if (over > 0.01){
    const pts = Math.round(over*CONFIG.GLOW_OVERFLOW_SCORE);
    state.score += pts;
    toast('Overflow +' + pts, '#FFD76A');
  }
  setGlow(state.glow + n);
}

/* ============================ UPDATE ============================ */
function updatePlayer(dt){
  const p = state.player;
  const tx = laneX(p.lane);
  const tau = CONFIG.PLAYER_GLIDE/2.6;
  p.x += (tx - p.x) * (1 - Math.exp(-dt/Math.max(0.001,tau)));
  state.fireCd -= dt;
  if (state.fireCd <= 0){
    state.fireCd = 1/state.stats.fireRate;
    const s = state.stats;
    fireVolley(p.lane, s.damage, s.pierce, s.slow);
    state.volleyIndex++;
    if ((state.glowTier >= 4 && state.volleyIndex % CONFIG.GLOW_FULL_EVERY === 0) || (boon('side') && state.volleyIndex % Math.max(2, 5 - boon('side')) === 0)){
      const adj = [(p.lane+1)%CONFIG.LANES, (p.lane+CONFIG.LANES-1)%CONFIG.LANES];
      for (let i=0;i<adj.length;i++) fireFrom(adj[i], s.damage, s.pierce, state.reefY-16, true);
    }
    Audio_.shot();
  }
  while (state.pets.length && state.pets[0] <= state.time){ state.pets.shift(); toast('A hatchling swam off', null, true); }
  if (state.pets.length){
    state.petCd -= dt;
    if (state.petCd <= 0){
      state.petCd = 1/(CONFIG.PET_RATE*state.pets.length);
      fireFrom(p.lane, state.stats.damage, 0, state.reefY - 20);
    }
  }
}
function updateGates(dt){
  for (let i=state.gates.length-1;i>=0;i--){
    const g = state.gates[i];
    g.y += CONFIG.GATE_SPEED*state.playH*dt;
    const stage = gateStage(g);
    g.age += dt;
    if (gateStage(g) > stage) triggerGuide('gate:ripe', g.x, g.y);
    if (stage === 3 && isDeep(g) && g.kind !== 'rot') triggerGuide('gate:deep', g.x, g.y);
    if (g.y >= state.reefY){
      spawnBurst(g.x, state.reefY, '255,215,106', 10, 70);
      state.gates.splice(i,1);
    }
  }
}
function updateEnemies(dt){
  const playH = state.playH;
  for (let i=state.enemies.length-1;i>=0;i--){
    const e = state.enemies[i];
    if (e.dead) continue;
    e.prevY = e.y;
    let slow = e.boss ? 1 : tideSpeed() * (mod('riptide') ? 1.2 : 1);
    if (e.slowUntil > state.time) slow *= (e.slowMul || 1);
    if (state.frostUntil > state.time) slow *= e.boss ? (1 - CONFIG.FROST_BOSS_SLOW) : (1 - CONFIG.FROST_SLOW);
    e.curSlow = slow;
    // behaviour
    if (e.behavior === 'wiggle'){
      e.x = laneX(e.lane) + Math.sin(state.time*6 + e.phase)*e.r*0.7;
    } else if (e.behavior === 'dash'){
      if (!e.dashStarted && e.y >= e.dashAt){
        e.dashStarted = true;
        e.lane = neighborLane(e.lane);
        e.dashX0 = e.x; e.dashX1 = laneX(e.lane); e.dashT = 0;
      }
      if (e.dashStarted && e.dashT < 0.4){
        e.dashT += dt;
        e.x = lerp(e.dashX0, e.dashX1, clamp(e.dashT/0.4,0,1));
      } else {
        e.x = laneX(e.lane);
      }
    } else {
      e.x = laneX(e.lane) + (e.xoff||0);
    }
    // move
    e.y += e.speed*playH*dt*e.curSlow;
    // cloning
    checkClone(e);
    // reef
    if (e.y >= state.reefY){
      if (e.boss){ gameOver(); return; }
      leak(e);
    }
  }
}
function checkClone(e){
  if (e.boss || !e.cloneable || e.leak > 1) return;
  for (let i=0;i<state.gates.length;i++){
    const g = state.gates[i];
    if (g.lane !== e.lane || g.kind === 'rot') continue;
    if (e.prevY < g.y && e.y >= g.y){
      e.cloneable = false;
      if (gateStage(g) > 1){
        g.eaten++;
        spawnBurst(g.x, g.y, '255,180,110', 8, 90);
      } else if (g.clones < CONFIG.GATE_MAX_CLONES){
        spawnClone(e, g);
        g.clones++;
        spawnBurst(g.x, g.y, '255,46,99', 6, 80);
        triggerCallout('clone:first', 'Cloned!', 'Creatures passing an unclaimed gate are copied.', g.x, g.y);
        if (g.clones >= CONFIG.GATE_MAX_CLONES){
          spawnBurst(g.x, g.y, '255,46,99', 18, 130);
          state.gates.splice(i,1);
        }
      }
      return;
    }
  }
}
function updateSentries(dt){
  for (let i=state.sentries.length-1;i>=0;i--){
    const s = state.sentries[i];
    if (s.until && state.time >= s.until){
      spawnBurst(s.x, state.reefY-22, '143,247,210', 10, 70);
      state.sentries.splice(i,1);
      continue;
    }
    s.x = laneX(s.lane);
    s.cd -= dt;
    if (s.cd <= 0){
      s.cd = 1/s.rate;
      fireFrom(s.lane, s.damage, 0, state.reefY - 26, true);
    }
  }
}
function updateBullets(dt){
  const playH = state.playH;
  for (let i=state.bullets.length-1;i>=0;i--){
    const b = state.bullets[i];
    b.prevY = b.y;
    b.y -= CONFIG.BULLET_SPEED*playH*dt;
    if (b.y < state.topY - 24){ state.bullets.splice(i,1); continue; }
    let best = null, bestY = -1, bestIsGate = false;
    for (let j=0;j<state.enemies.length;j++){
      const e = state.enemies[j];
      if (e.dead || e.lane !== b.lane) continue;
      if (b.hits[e.id]) continue;
      const rad = e.r + CONFIG.BULLET_R;
      if (e.y + rad >= b.y && e.y - rad <= b.prevY){ if (e.y > bestY){ bestY = e.y; best = e; bestIsGate = false; } }
    }
    for (let j=0;j<state.gates.length;j++){
      const g = state.gates[j];
      if (b.noGate || g.lane !== b.lane) continue;
      if (b.hits[g.id]) continue;
      const rad = CONFIG.GATE_H*0.5 + CONFIG.BULLET_R;
      if (g.y + rad >= b.y && g.y - rad <= b.prevY){ if (g.y > bestY){ bestY = g.y; best = g; bestIsGate = true; } }
    }
    if (!best) continue;
    b.hits[best.id] = true;
    if (bestIsGate){
      const g = best;
      g.charge += b.damage * state.stats.gateChargeMul;
      Audio_.charge(clamp(g.charge/g.needed,0,1));
      spawnBurst(b.x, g.y, '255,215,106', 3, 60);
      if (g.charge >= g.needed){
        claimGate(g);
        const gi = state.gates.indexOf(g);
        if (gi >= 0) state.gates.splice(gi,1);
      }
    } else {
      hitEnemy(best, b);
    }
    if (b.pierce > 0) b.pierce--; else state.bullets.splice(i,1);
  }
}
function updateParticles(dt){
  for (let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.life -= dt;
    if (p.life <= 0){ state.particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.vy += 40*dt;
  }
  for (let i=state.arcs.length-1;i>=0;i--){
    state.arcs[i].t -= dt;
    if (state.arcs[i].t <= 0) state.arcs.splice(i,1);
  }
  for (let i=state.ripples.length-1;i>=0;i--){
    state.ripples[i].t -= dt;
    if (state.ripples[i].t <= 0) state.ripples.splice(i,1);
  }
}
function updateSpawning(dt){
  for (let i=state.spawnQueue.length-1;i>=0;i--){
    const s = state.spawnQueue[i];
    s.t -= dt;
    if (s.t <= 0){
      if (s.type === 'krill') spawnKrillCluster(s.lane, null);
      else newEnemy(s.type, s.lane, state.topY - ENEMY_TYPES[s.type].r - 8);
      state.spawnQueue.splice(i,1);
    }
  }
}
function update(dt){
  state.time += dt;
  // Drain grows with Glow: high tiers need upkeep, low tiers stay stable. A claim pauses it briefly.
  const glowFloor = state.vent === 'lantern' && state.glow >= 1 ? 1 : 0;
  if (state.glow > glowFloor && state.time >= state.glowGraceUntil){
    const drain = (CONFIG.GLOW_DRAIN_BASE + CONFIG.GLOW_DRAIN_PER*state.glow) * (state.zone === 1 ? CONFIG.ZONE1_DRAIN_MUL : 1) * Math.pow(0.65, boon('steady')) * (mod('riptide') ? 0.7 : 1) * (state.vent === 'tidecaller' ? (state.flood ? 1.6 : 0) : 1);
    setGlow(Math.max(glowFloor, state.glow - dt*drain));
  }
  const playH = state.playH;
  if (state.phase === 'waves'){
    state.tZone += dt;
    state.waveTimer -= dt;
    if (state.waveTimer <= 0){ state.waveTimer = waveInterval(); scheduleWave(); }
    if (state.tZone >= CONFIG.ZONE_DURATION) startBoss();
  } else {
    state.tZone += dt;
  }
  state.gateTimer -= dt;
  if (state.gateTimer <= 0){ state.gateTimer = gateInterval()/(1 + oysterExtra()); spawnGate(); }
  if (state.vent === 'tidecaller' && (Math.floor(state.time/10) % 2 === 1) !== state.flood){
    state.flood = !state.flood;
    recalcStats();
    state.banner = { text: state.flood ? 'FLOOD' : 'EBB', t:1.0, max:1.0 };
  }
  if (state.advanceTimer > 0){
    state.advanceTimer -= dt;
    if (state.advanceTimer <= 0) offerBoons();
  }
  if (BOT) autopilot(dt);
  updatePlayer(dt);
  updateSpawning(dt);
  updateGates(dt);
  updateEnemies(dt);
  if (state.screen !== 'playing') return;
  updateBoss(dt);
  updateSentries(dt);
  updateBullets(dt);
  processDeaths();
  updateParticles(dt);
  state.shake *= Math.pow(0.001, dt);
  if (state.shake < 0.2) state.shake = 0;
  for (let i=0;i<3;i++){ state.laneFlash[i] = Math.max(0, state.laneFlash[i] - dt*2.2); }
  state.dangerFlash = Math.max(0, state.dangerFlash - dt*2.2);
  updateToasts(dt);
  updateHud();
}
function autopilot(dt){
  const p = state.player, playH = state.playH;
  const front = [-Infinity,-Infinity,-Infinity];
  for (let i=0;i<state.enemies.length;i++){
    const e = state.enemies[i];
    if (!e.dead && e.y > front[e.lane]) front[e.lane] = e.y;
  }
  let low = 0;
  for (let l=1;l<CONFIG.LANES;l++) if (front[l] > front[low]) low = l;
  if (front[low] >= state.reefY - 0.3*playH){
    for (let i=0;i<state.pearls.length;i++){
      if (state.pearls[i]){ usePearl(i); break; }
    }
  }
  if (front[low] >= state.reefY - 0.35*playH){ p.lane = low; return; }
  let gl = -1, gn = Infinity;
  for (let i=0;i<state.gates.length;i++){
    const g = state.gates[i];
    if (g.kind === 'rot' || g.charge >= g.needed || g.y >= state.reefY - 0.3*playH) continue;
    let n = 0;
    for (let j=0;j<state.enemies.length;j++){ const e = state.enemies[j]; if (!e.dead && e.lane === g.lane && e.y > g.y) n++; }
    if (n < gn){ gn = n; gl = g.lane; }
  }
  if (gl >= 0) p.lane = gl;
  else if (front[low] > -Infinity) p.lane = low;
}

/* ============================ HUD ============================ */
let hudCache = { score:-1, depth:-1, zone:-1, boss:-1 };
function updateHud(){
  const depth = state.zone*100 + Math.floor(Math.min(state.tZone,99));
  if (state.score !== hudCache.score){ hudCache.score = state.score; hScoreEl.textContent = String(state.score); }
  if (depth !== hudCache.depth){ hudCache.depth = depth; hDepthEl.textContent = depth+'m'; }
  const frac = state.phase === 'waves' ? clamp(state.tZone/CONFIG.ZONE_DURATION,0,1) : 1;
  zoneFillEl.style.width = (frac*100).toFixed(1)+'%';
  if (state.boss){
    const f = bossHpFrac();
    bossfillEl.style.width = (f*100).toFixed(1)+'%';
  }
}

/* ============================ RENDER ============================ */
function render(){
  const W = state.W, H = state.H;
  if (bgZone !== state.zone) buildBg();
  ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
  ctx.save();
  if (state.shake > 0.2 && !reduceMotion){
    ctx.translate((fx()-0.5)*state.shake, (fx()-0.5)*state.shake);
  }
  ctx.fillStyle = bgGrad || '#04121F';
  ctx.fillRect(-20,-20,W+40,H+40);
  drawKelp();
  drawAmbience();
  drawLaneFloor();
  drawIncoming();
  // lane flashes
  for (let l=0;l<3;l++){
    if (state.laneFlash[l] > 0){
      const g = ctx.createLinearGradient(0,state.topY,0,state.reefY);
      g.addColorStop(0,'rgba(255,46,99,0)');
      g.addColorStop(0.7,'rgba(255,46,99,'+(0.30*state.laneFlash[l])+')');
      g.addColorStop(1,'rgba(255,46,99,'+(0.5*state.laneFlash[l])+')');
      ctx.fillStyle = g;
      ctx.fillRect(l*laneW(), state.topY, laneW(), state.reefY-state.topY);
    }
  }
  drawGates();
  drawSentries();
  drawEnemies();
  drawBullets();
  drawArcs();
  drawRipples();
  drawParticles();
  if (state.screen !== 'title' && state.screen !== 'intro'){ drawDeepLine(); drawPlayer(); drawPets(); }
  drawShells();
  drawGlowMeter();
  drawPearlTray();
  drawPearlTimers();
  drawBanner();
  ctx.restore();
  drawNameFlash();
  drawCallout();
}
function drawKelp(){
  ctx.save();
  ctx.strokeStyle = 'rgba(27,58,92,0.55)';
  ctx.lineWidth = 1.5;
  for (let l=1;l<CONFIG.LANES;l++){
    const base = l*laneW();
    ctx.beginPath();
    for (let y=state.topY-20; y<=state.reefY+10; y+=14){
      const x = base + Math.sin(y*0.035 + state.time*0.7 + l)*6;
      if (y === state.topY-20) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawLaneFloor(){
  const w = laneW();
  const top = state.topY, bottom = state.reefY;
  ctx.save();
  for (let l=0;l<CONFIG.LANES;l++){
    const middle = l === Math.floor(CONFIG.LANES/2);
    const a = middle ? CONFIG.LANE_TINT_ALPHA : CONFIG.LANE_TINT_ALT_ALPHA;
    const rgb = middle ? CONFIG.LANE_TINT_RGB : CONFIG.LANE_TINT_ALT_RGB;
    ctx.fillStyle = 'rgba('+rgb+','+a+')';
    ctx.fillRect(l*w, top, w, bottom-top);
  }
  if (state.screen !== 'title' && state.screen !== 'intro'){
    const p = state.player;
    const g = ctx.createLinearGradient(0, bottom, 0, top);
    g.addColorStop(0, 'rgba('+CONFIG.LANE_PLAYER_TINT_RGB+','+CONFIG.LANE_PLAYER_TINT_ALPHA+')');
    g.addColorStop(1, 'rgba('+CONFIG.LANE_PLAYER_TINT_RGB+',0)');
    ctx.fillStyle = g;
    ctx.fillRect(p.lane*w, top, w, bottom-top);
  }
  ctx.restore();
}
// Incoming waves: a coral chevron per lane that brightens as the wave nears, wider for bigger waves.
function drawIncoming(){
  if (state.screen === 'title' || state.screen === 'intro') return;
  const soon = [Infinity,Infinity,Infinity], n = [0,0,0];
  for (let i=0;i<state.spawnQueue.length;i++){ const q = state.spawnQueue[i]; n[q.lane]++; soon[q.lane] = Math.min(soon[q.lane], q.t); }
  ctx.save();
  for (let l=0;l<CONFIG.LANES;l++){
    if (!n[l]) continue;
    const k = clamp(1 - soon[l]/CONFIG.WAVE_WARN, 0, 1);
    const a = 0.35 + 0.5*k + 0.15*Math.sin(state.time*14);
    const x = laneX(l), y = state.topY + 6, w = 10 + Math.min(14, n[l]*1.5);
    drawGlow('255,46,99', x, y, 18 + w, 0.25 + 0.35*k);
    ctx.strokeStyle = 'rgba(255,106,61,' + a.toFixed(2) + ')';
    ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let c=0;c<2;c++){
      ctx.beginPath(); ctx.moveTo(x - w, y - 6 + c*9); ctx.lineTo(x, y + 2 + c*9); ctx.lineTo(x + w, y - 6 + c*9); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawDeepLine(){
  const y = state.reefY - CONFIG.DEEP_RANGE*state.playH;
  ctx.save();
  ctx.strokeStyle = 'rgba(143,247,210,0.16)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,7]);
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(state.W, y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(143,247,210,0.32)';
  ctx.font = "600 9px Sora, system-ui, sans-serif";
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('DEEP', 6, y - 3);
  ctx.restore();
}
function drawPets(){
  for (let i=0;i<state.pets.length;i++){
    const side = i === 0 ? -1 : 1;
    const left = state.pets[i] - state.time;
    if (left < 5 && Math.sin(state.time*(left < 2 ? 24 : 12)) < 0) continue; // blinks before it leaves
    const x = state.player.x + side*34, y = state.reefY - 4 + Math.sin(state.time*4 + i*2)*3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow('143,247,210', x, y, 16, 0.6);
    ctx.restore();
    ctx.fillStyle = '#8FF7D2';
    ctx.beginPath(); ctx.ellipse(x, y, 7, 6, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#04121F';
    ctx.beginPath(); ctx.arc(x - 2.5, y - 1, 1.3, 0, 6.2832); ctx.arc(x + 2.5, y - 1, 1.3, 0, 6.2832); ctx.fill();
  }
}
function drawPlayer(){
  const p = state.player;
  const tier = state.glowTier;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow('79,240,224', p.x, state.reefY, 46 + tier*9, 0.85 + tier*0.03);
  ctx.restore();
  // body shell
  ctx.save();
  ctx.translate(p.x, state.reefY);
  if (tier > 0){
    ctx.fillStyle = 'rgba(184,255,242,0.55)';
    for (let i=0;i<tier;i++){
      const a = state.time*0.9 + i*6.2832/tier;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*(23+tier*2), Math.sin(a)*(15+tier*1.5), 7, 3.4, a, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.fillStyle = '#4FF0E0';
  ctx.beginPath();
  ctx.moveTo(0,-20);
